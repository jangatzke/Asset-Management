name: Asset Management CI/CD Pipeline (Phase 12)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write

env:
  NODE_VERSION: '20'
  PRISMA_TELEMETRY_INFORMATION_DISABLED: '1'

jobs:
  # =====================================================================
  # PRE-FLIGHT CHECKS
  # =====================================================================
  preflight:
    name: Pre-flight Checks
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.filter.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for relevant file changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            has_changes:
              - 'backend/**'
              - 'frontend/**'
              - 'shared/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
              - 'prisma/**'
              - 'scripts/**'

  # =====================================================================
  # LINT
  # =====================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_changes == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  # =====================================================================
  # BUILD & TYPE CHECK
  # =====================================================================
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_changes == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=shared

      - name: Build backend
        run: npm run build --workspace=backend

      - name: Build frontend
        run: npm run build --workspace=frontend

  # =====================================================================
  # PRISMA VALIDATION
  # =====================================================================
  prisma-validate:
    name: Prisma Validation
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_changes == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Prisma
        run: npx prisma --version

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Format check (Prisma)
        run: npx prisma format --check

  # =====================================================================
  # UNIT TESTS
  # =====================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_changes == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run backend unit tests
        run: npm test --workspace=backend -- --coverage=false

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # =====================================================================
  # INTEGRATION TESTS
  # =====================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_changes == 'true' || github.event_name == 'push'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
        run: |
          npx prisma generate --workspace=backend
          npx prisma migrate deploy --schema=backend/prisma/schema.prisma
          npm test --workspace=backend -- --testPathPattern=integration --coverage=false

  # =====================================================================
  # FRONTEND TESTS
  # =====================================================================
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_changes == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test --workspace=frontend -- --watch=false

  # =====================================================================
  # SAST (Static Application Security Testing) — SARIF OUTPUT
  # =====================================================================
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_changes == 'true' || github.event_name == 'push'
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep SAST (SARIF output)
        run: |
          semgrep scan \
            --config=auto \
            --error \
            --output-format=sarif \
            --output=semgrep-results.sarif \
            backend/src/ frontend/src/ shared/src/

      - name: Upload SAST report (SARIF)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
          wait-for-processing: true

  # =====================================================================
  # DEPENDENCY SCAN — BLOCKS ON HIGH/CRITICAL VULNERABILITIES
  # =====================================================================
  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_changes == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (blocks on high/critical)
        run: npm audit --production --audit-level=high

      - name: Generate audit report for artifacts (captures output even on failure)
        run: |
          set +e
          npm audit --json > npm-audit-report.json 2>&1
          exit_code=$?
          if [ $exit_code -eq 0 ]; then
            echo "Audit passed — no vulnerabilities found"
          elif [ $exit_code -eq 1 ]; then
            echo "Audit failed — vulnerabilities detected (report saved)"
          else
            echo "Audit error (exit code: $exit_code) — report may be incomplete"
          fi

      - name: Check vulnerability allowlist
        run: npx tsx scripts/check-vulnerabilities.ts

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-report.json

  # =====================================================================
  # SECRET SCAN
  # =====================================================================
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_changes == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =====================================================================
  # SBOM GENERATION
  # =====================================================================
  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_changes == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate SBOM (CycloneDX)
        uses: cyclonedx/cyclonedx-npm-action@v1
        with:
          output: sbom.json
          json: true

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  # =====================================================================
  # CONTAINER SCAN (Trivy) — FAILS ON BUILD ERROR
  # =====================================================================
  container-scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_changes == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Check for Dockerfile
        id: dockerfile-check
        run: |
          if [ -f backend/Dockerfile ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build test image
        if: steps.dockerfile-check.outputs.exists == 'true'
        run: |
          docker build -t asset-mgmt-test:latest \
            --target production \
            -f backend/Dockerfile .

      - name: Run Trivy scan
        if: steps.dockerfile-check.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: asset-mgmt-test:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        if: always() && steps.dockerfile-check.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Skip container scan (no Dockerfile)
        if: steps.dockerfile-check.outputs.exists != 'true'
        run: echo "WARNING: No backend/Dockerfile found — skipping container scan"

  # =====================================================================
  # REQUIREMENTS CHECK
  # =====================================================================
  requirements-check:
    name: Requirements Check
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_changes == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run requirements check
        run: npm run requirements-check

  # =====================================================================
  # MIGRATION TEST — EMPTY DB -> migrate deploy -> seed -> tests
  # =====================================================================
  migration-test:
    name: Migration Test (Empty DB)
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_changes == 'true' || github.event_name == 'push'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb_empty
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --workspace=backend

      - name: Verify empty database (no tables)
        run: |
          PGPASSWORD=testpass psql -h localhost -U testuser -d testdb_empty -c "SELECT table_name FROM information_schema.tables WHERE table_schema = 'public';" || echo "No tables yet — migration required"

      - name: Run prisma migrate deploy (applies all migrations to empty DB)
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb_empty
        run: |
          npx prisma migrate deploy --schema=backend/prisma/schema.prisma

      - name: Verify migrations applied
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb_empty
        run: |
          npx prisma migrate status --schema=backend/prisma/schema.prisma

      - name: Seed database
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb_empty
        run: |
          npx prisma db seed --workspace=backend || echo "Seed completed or skipped"

      - name: Run integration tests on migrated DB
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb_empty
        run: |
          npm test --workspace=backend -- --testPathPattern=integration --coverage=false

  # =====================================================================
  # CI CONFIG VALIDATION TESTS
  # =====================================================================
  ci-config-test:
    name: CI Config Validation
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_changes == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run CI config validation tests
        run: npx vitest run scripts/__tests__/ci-config.test.ts

  # =====================================================================
  # RELEASE GATES (Final Gate)
  # =====================================================================
  release-gates:
    name: Release Gates
    runs-on: ubuntu-latest
    needs:
      - lint
      - build
      - prisma-validate
      - unit-tests
      - integration-tests
      - frontend-tests
      - sast
      - dependency-scan
      - secret-scan
      - sbom
      - container-scan
      - requirements-check
      - migration-test
    if: always() && (github.event_name == 'push' || github.head_ref == 'main')
    steps:
      - name: Check all required jobs passed
        run: |
          echo "=== RELEASE GATE CHECK ==="

          # All mandatory jobs must pass
          for job in lint build prisma-validate unit-tests integration-tests frontend-tests; do
            if [[ "${{ needs.$job.result }}" != "success" ]]; then
              echo "::error::Required job $job failed: ${{ needs.$job.result }}"
              exit 1
            fi
            echo "+ $job passed"
          done

          # Security checks — must not fail
          for job in sast secret-scan; do
            if [[ "${{ needs.$job.result }}" == "failure" ]]; then
              echo "::error::Security scan $job failed"
              exit 1
            fi
            echo "+ $job passed"
          done

          # Dependency scan — must pass (no unallowlisted high/critical vulns)
          if [[ "${{ needs.dependency-scan.result }}" != "success" ]]; then
            echo "::error::Dependency scan failed — unresolved vulnerabilities"
            exit 1
          fi
          echo "+ dependency-scan passed"

          # SBOM check
          if [[ "${{ needs.sbom.result }}" != "success" ]]; then
            echo "::error::SBOM generation failed"
            exit 1
          fi
          echo "+ SBOM generated"

          # Container scan — must pass or be skipped (no Dockerfile)
          if [[ "${{ needs.container-scan.result }}" == "failure" ]]; then
            echo "::error::Container scan failed"
            exit 1
          fi
          echo "+ container-scan passed (or skipped)"

          # Requirements check — must pass
          if [[ "${{ needs.requirements-check.result }}" != "success" ]]; then
            echo "::error::Requirements check failed"
            exit 1
          fi
          echo "+ requirements-check passed"

          # Migration test — must pass
          if [[ "${{ needs.migration-test.result }}" != "success" ]]; then
            echo "::error::Migration test failed"
            exit 1
          fi
          echo "+ migration-test passed"

          echo ""
          echo "=== ALL RELEASE GATES PASSED ==="
