name: Asset Management CI/CD Pipeline (Phase 12)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write

env:
  NODE_VERSION: '20'
  PRISMA_TELEMETRY_INFORMATION_DISABLED: '1'

# dorny/paths-filter@v3 and gitleaks/gitleaks-action@v2 are currently the
# latest stable major versions used here; keep them pinned until their
# maintainers publish Node.js 24 runtime majors.

jobs:
  # =====================================================================
  # PRE-FLIGHT CHECKS
  # =====================================================================
  preflight:
    name: Pre-flight Checks
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.filter.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v5

      - name: Check for relevant file changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            has_changes:
              - 'backend/**'
              - 'frontend/**'
              - 'shared/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
              - 'prisma/**'
              - 'scripts/**'

  # =====================================================================
  # LINT
  # =====================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_changes == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run lint
        run: npm run lint

  # =====================================================================
  # BUILD & TYPE CHECK
  # =====================================================================
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_changes == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build shared package
        run: npm run build --workspace=shared

      - name: Generate Prisma client
        run: npm exec --workspace=backend -- prisma generate

      - name: Build backend
        run: npm run build --workspace=backend

      - name: Build frontend
        run: npm run build --workspace=frontend

  # =====================================================================
  # PRISMA VALIDATION
  # =====================================================================
  prisma-validate:
    name: Prisma Validation
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_changes == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Prisma
        run: npx prisma --version

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Format check (Prisma)
        run: npx prisma format --check

  # =====================================================================
  # UNIT TESTS
  # =====================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_changes == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run backend unit tests
        run: npm test --workspace=backend -- --coverage=false

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # =====================================================================
  # INTEGRATION TESTS
  # =====================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_changes == 'true' || github.event_name == 'push'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
        run: |
          npm exec --workspace=backend -- prisma generate
          npx prisma migrate deploy --schema=backend/prisma/schema.prisma
          npm test --workspace=backend -- --testPathPattern=integration --coverage=false

  # =====================================================================
  # FRONTEND TESTS
  # =====================================================================
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_changes == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run frontend tests
        run: npm test --workspace=frontend -- --watch=false

  # =====================================================================
  # SAST (Static Application Security Testing) — REPORT-ONLY SARIF OUTPUT
  # =====================================================================
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_changes == 'true' || github.event_name == 'push'
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v5

      - name: Run Semgrep SAST (report-only SARIF output)
        run: |
          echo "Semgrep is configured as report-only in CI: findings are uploaded as SARIF and reviewed in GitHub Security, but findings alone do not fail release gates."
          semgrep scan \
            --config=auto \
            --sarif \
            -o semgrep-results.sarif \
            backend/src/ frontend/src/ shared/src/

      - name: Upload SAST report (SARIF)
        if: always() && hashFiles('semgrep-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep-results.sarif
          wait-for-processing: true

  # =====================================================================
  # DEPENDENCY SCAN — BLOCKS ON HIGH/CRITICAL VULNERABILITIES
  # =====================================================================
  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_changes == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Generate audit report for artifacts
        run: |
          set +e
          npm audit --json > npm-audit-report.json 2>&1
          exit_code=$?
          if [ ! -s npm-audit-report.json ]; then
            printf '{"error":"npm audit produced no output","exitCode":%s}\n' "$exit_code" > npm-audit-report.json
          fi
          if [ $exit_code -eq 0 ]; then
            echo "Audit passed — no vulnerabilities found"
          elif [ $exit_code -eq 1 ]; then
            echo "Audit failed — vulnerabilities detected (report saved)"
          else
            echo "Audit error (exit code: $exit_code) — report saved if available"
          fi

      - name: Run npm audit (blocks on high/critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Check vulnerability allowlist
        run: npx tsx scripts/check-vulnerabilities.ts

      - name: Upload audit report
        if: always() && hashFiles('npm-audit-report.json') != ''
        uses: actions/upload-artifact@v6
        with:
          name: npm-audit-report
          path: npm-audit-report.json

  # =====================================================================
  # SECRET SCAN
  # =====================================================================
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_changes == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =====================================================================
  # SBOM GENERATION
  # =====================================================================
  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_changes == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Generate SBOM (CycloneDX)
        run: npx @cyclonedx/cyclonedx-npm --output-format JSON --output-file sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v6
        with:
          name: sbom
          path: sbom.json

  # =====================================================================
  # CONTAINER SCAN (Trivy) — FAILS ON BUILD ERROR
  # =====================================================================
  container-scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_changes == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - name: Check for Dockerfile
        id: dockerfile-check
        run: |
          if [ -f backend/Dockerfile ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build test image
        if: steps.dockerfile-check.outputs.exists == 'true'
        run: |
          docker build -t asset-mgmt-test:latest \
            --target production \
            -f backend/Dockerfile .

      - name: Run Trivy scan
        if: steps.dockerfile-check.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: asset-mgmt-test:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        if: always() && steps.dockerfile-check.outputs.exists == 'true' && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Skip container scan (no Dockerfile)
        if: steps.dockerfile-check.outputs.exists != 'true'
        run: |
          echo "WARNING: No backend/Dockerfile found — skipping container scan"

  # =====================================================================
  # REQUIREMENTS CHECK
  # =====================================================================
  requirements-check:
    name: Requirements Check
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_changes == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run requirements check
        run: npm run requirements-check

  # =====================================================================
  # MIGRATION TEST — EMPTY DB -> migrate deploy -> seed -> tests
  # =====================================================================
  migration-test:
    name: Migration Test (Empty DB)
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_changes == 'true' || github.event_name == 'push'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb_empty
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Generate Prisma client
        run: npm exec --workspace=backend -- prisma generate

      - name: Verify empty database (no tables)
        run: |
          PGPASSWORD=testpass psql -h localhost -U testuser -d testdb_empty -c "SELECT table_name FROM information_schema.tables WHERE table_schema = 'public';" || echo "No tables yet — migration required"

      - name: Run prisma migrate deploy (applies all migrations to empty DB)
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb_empty
        run: |
          npx prisma migrate deploy --schema=backend/prisma/schema.prisma

      - name: Verify migrations applied
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb_empty
        run: |
          npx prisma migrate status --schema=backend/prisma/schema.prisma

      - name: Seed database
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb_empty
        run: |
          npm exec --workspace=backend -- prisma db seed || echo "Seed completed or skipped"

      - name: Run integration tests on migrated DB
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb_empty
        run: |
          npm test --workspace=backend -- --testPathPattern=integration --coverage=false

  # =====================================================================
  # CI CONFIG VALIDATION TESTS
  # =====================================================================
  ci-config-test:
    name: CI Config Validation
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_changes == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run CI config validation tests
        run: npm test --workspace=backend -- --runTestsByPath src/__tests__/ci-config.test.ts --coverage=false

  # =====================================================================
  # RELEASE GATES (Final Gate)
  # =====================================================================
  release-gates:
    name: Release Gates
    runs-on: ubuntu-latest
    needs:
      - preflight
      - lint
      - build
      - prisma-validate
      - unit-tests
      - integration-tests
      - frontend-tests
      - sast
      - dependency-scan
      - secret-scan
      - sbom
      - container-scan
      - requirements-check
      - migration-test
    if: always() && (github.event_name == 'push' || github.base_ref == 'main')
    steps:
      - name: Check all required jobs passed
        run: |
          echo "=== RELEASE GATE CHECK ==="

          if [[ "${{ github.event_name }}" == "pull_request" && "${{ needs.preflight.outputs.has_changes }}" != "true" ]]; then
            echo "No release-relevant changes detected — accepting intentionally skipped CI jobs."
            exit 0
          fi

          # All mandatory jobs must pass
          for job in lint build prisma-validate unit-tests integration-tests frontend-tests; do
            case "$job" in
              lint) result="${{ needs.lint.result }}" ;;
              build) result="${{ needs.build.result }}" ;;
              prisma-validate) result="${{ needs.prisma-validate.result }}" ;;
              unit-tests) result="${{ needs.unit-tests.result }}" ;;
              integration-tests) result="${{ needs.integration-tests.result }}" ;;
              frontend-tests) result="${{ needs.frontend-tests.result }}" ;;
            esac

            if [[ "$result" != "success" ]]; then
              echo "::error::Required job $job failed: $result"
              exit 1
            fi
            echo "+ $job passed"
          done

          # Security scan infrastructure must not fail. Semgrep findings are report-only:
          # they are uploaded as SARIF for review, but findings alone do not block release gates.
          for job in sast secret-scan; do
            case "$job" in
              sast) result="${{ needs.sast.result }}" ;;
              secret-scan) result="${{ needs.secret-scan.result }}" ;;
            esac

            if [[ "$result" == "failure" ]]; then
              echo "::error::Security scan $job failed"
              exit 1
            fi
            echo "+ $job passed"
          done

          # Dependency scan — must pass (no unallowlisted high/critical vulns)
          if [[ "${{ needs.dependency-scan.result }}" != "success" ]]; then
            echo "::error::Dependency scan failed — unresolved vulnerabilities"
            exit 1
          fi
          echo "+ dependency-scan passed"

          # SBOM check
          if [[ "${{ needs.sbom.result }}" != "success" ]]; then
            echo "::error::SBOM generation failed"
            exit 1
          fi
          echo "+ SBOM generated"

          # Container scan — must pass or be skipped (no Dockerfile)
          if [[ "${{ needs.container-scan.result }}" == "failure" ]]; then
            echo "::error::Container scan failed"
            exit 1
          fi
          echo "+ container-scan passed (or skipped)"

          # Requirements check — must pass
          if [[ "${{ needs.requirements-check.result }}" != "success" ]]; then
            echo "::error::Requirements check failed"
            exit 1
          fi
          echo "+ requirements-check passed"

          # Migration test — must pass
          if [[ "${{ needs.migration-test.result }}" != "success" ]]; then
            echo "::error::Migration test failed"
            exit 1
          fi
          echo "+ migration-test passed"

          echo ""
          echo "=== ALL RELEASE GATES PASSED ==="
