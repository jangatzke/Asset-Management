              schema:
                $ref: '#/components/schemas/WorkflowActionListResponse'

  /isms-operations/{resource}/reminders/run:
    post:
      summary: Run the reminder sweep for a generic resource key
      description: >
        Evaluates due items for the resource key based on PHASE6_MODEL_MAP
        dueField configuration, logs deliveries in dry-run mode
        (sendEmail false) and returns counts plus the evaluated items. The
        permission is resolved via RESOURCE_PERMISSION_ALIAS (e.g. suppliers
        -> suppliers.write, bias/bcps -> bcm.write, auditPlans -> audits.write).
      tags: [ISMS Operations]
      security: [{ bearerAuth: [] }]
      x-permission: resource-mapped write permission (see Phase6Resource enum and RESOURCE_PERMISSION_ALIAS)
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Phase6Resource'
      responses:
        '200':
          description: Reminder run summary (runId, count, sent, skipped, failed, reminders)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderRunResponse'
        '400': { description: Resource has no due-date field }
        '404': { description: Unknown resource key }

  /isms-operations/reminders/{resource}:
    post:
      summary: Run the reminder sweep for a resource key (alternate path form)
      description: >
        Same handler contract as /isms-operations/{resource}/reminders/run; both
        paths are registered by phase6.routes.ts and resolve permissions via
        RESOURCE_PERMISSION_ALIAS.
      tags: [ISMS Operations]
      security: [{ bearerAuth: [] }]
      x-permission: resource-mapped write permission (see Phase6Resource enum and RESOURCE_PERMISSION_ALIAS)
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Phase6Resource'
      responses:
        '200':
          description: Reminder run summary (runId, count, sent, skipped, failed, reminders)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderRunResponse'
        '400': { description: Resource has no due-date field }
        '404': { description: Unknown resource key }

