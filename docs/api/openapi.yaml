      description: >
        Admin-only management surface. The management router is guarded by
        authenticate + authorize('admin'); individual operations additionally
        declare service-account scopes in the X-API-Scopes header contract
        (validated by backend/src/middleware/apiScopes.ts when wired per route).
      tags: [Service Accounts]
      security: [{ bearerAuth: [] }]
      x-permission: administration.access
      x-scopes: [serviceaccounts:read]
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: X-API-Scopes
          in: header
          required: false
          description: Comma-separated declared scopes (X-API-Scopes scope-contract header; must include serviceaccounts:read).
          schema: { type: string }
      responses:
        '200':
          description: Paginated service account list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountListResponse'
    post:
      summary: Create a new service account with API scopes
      tags: [Service Accounts]
      security: [{ bearerAuth: [] }]
      x-permission: administration.access
      x-scopes: [serviceaccounts:write]
      parameters:
        - name: X-API-Scopes
          in: header
          required: false
          description: Comma-separated declared scopes (X-API-Scopes scope-contract header; must include serviceaccounts:write).
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceAccountCreateRequest'
      responses:
        '201':
          description: Service account created with token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountResponse'

