          schema: { type: string }
      responses:
        '200': { description: Token metadata }

  /service-accounts/auth:
    post:
      summary: Authenticate a service account with its access token (unprotected route with dedicated rate limiter)
      description: >
        Token verification endpoint. It intentionally does NOT require admin
        authentication and performs its own token lookup/verification. It is not
        part of the X-API-Scopes management contract.
      tags: [Authentication]
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accessToken]
              properties:
                accessToken: { type: string }
      responses:
