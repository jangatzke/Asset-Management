    get:
      summary: Compact last-run-per-job status summary with windowed status counts
      description: Read-only JobRun aggregate for the last execution of every job, plus status counts inside the window. Raw payload/log columns and secrets are never returned.
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      x-permission: administration.access
      parameters:
        - name: windowHours
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 720, default: 24 }
          description: Time window in hours used for the status counts (1-720)
      responses:
        '200': { description: Job-run summary }
        '400':
          description: Out-of-range window rejected with a structured error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /admin/job-runs:
    get:
      summary: List recent JobRun history with filters and pagination
      description: |
        Read-only history of scheduler job runs. Returns the locked
        `{ data, pagination }` envelope plus the `X-Total-Count` header derived
        from `pagination.total`. The raw payload/log column is not exposed and
        error text is sanitized (mailbox addresses, auth fragments and long
        strings are redacted/bounded). Filters accept comma-separated values for
        `jobType` and `status`.
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      x-permission: administration.access
      parameters:
        - name: jobId
          in: query
          required: false
          schema: { type: string }
          description: Exact job identifier (for example ticket-email-gateway)
        - name: jobType
          in: query
          required: false
          schema: { type: string }
          description: Comma-separated job types
        - name: status
          in: query
          required: false
          schema: { type: string }
          description: Comma-separated statuses (pending, running, completed, failed, skipped)
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Inclusive lower bound of the run window
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Inclusive upper bound of the run window
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: order
          in: query
          required: false
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        '200':
          description: Paginated job-run history
          headers:
            X-Total-Count:
              schema: { type: integer }
              description: Total rows matching the filter (also mirrored in pagination.total)
        '400':
          description: Invalid filter, date or pagination input rejected with a structured error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Caller lacks administration.access

