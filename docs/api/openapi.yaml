      security: [{ bearerAuth: [] }]
      x-permission: authenticated-user
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 200 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50 } }
        - { name: type, in: query, required: false, description: Restrict to a single entity type (assets, tickets, incidents, risks, controls, contracts, licenses, suppliers, knowledge), schema: { type: string } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0 } }
