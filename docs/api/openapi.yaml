openapi: 3.1.0
info:
  title: Asset Management System API (ISO 27001)
  version: 1.1.0
  description: |
    RESTful API for IT Asset & ISMS Management with ISO 27001 compliance.

    Naming and compatibility strategy (improvement #7):
    - The canonical ISMS operations endpoints are served under `/api/v1/isms-operations`
      (the `phase6Router` mounted at that prefix in `backend/src/index.ts`). All
      domain operations are documented under domain-oriented tags (`ISMS Operations`,
      `Audit`, `Management Review`, `Compliance`, `Supply Chain`, `BCM`, `Training`,
      `KPIs`, `Reporting`, `Workflows`).
    - The legacy `/api/v1/phase6` mount is still registered and is kept as a
      compatibility alias. Its paths are documented with `deprecated: true` and
      clients should migrate to the equivalent `/api/v1/isms-operations` paths.
      The alias paths are not removed because the mount still exists in the router.
    - Operations that require a granular permission state it via `x-permission`,
      using the canonical permission catalog from `shared/src/permissions.ts`
      (e.g. `suppliers.read`, `bcm.write`, `audits.read`, `training.manage`).
      Operations authenticated without a granular permission guard use
      `x-permission: authenticated-user` (any authenticated user).
    - Service-account operations document their declared scope contract via
      `x-scopes`; the scope header contract is `X-API-Scopes` enforced by
      `backend/src/middleware/apiScopes.ts` where wired.
  contact:
    name: API Support

servers:
  - url: http://localhost:3001/api/v1
    description: Development (backend default port 3001; the frontend nginx proxy forwards only /api to the backend)
# NOTE (Stand 2026-10-30): the system endpoints /health, /health/live, /health/ready and
# /metrics are registered at the server ROOT path in backend/src/index.ts, i.e. they are
# NOT under the /api/v1 prefix used by the server URL above.

tags:
  - name: Assets
    description: IT asset inventory, lifecycle, relations, impact analysis and versions.
  - name: Risks
    description: Risk register, assessments, treatments, control links and restore.
  - name: Controls
    description: Controls, implementations, tests, Statement of Applicability and restore.
  - name: Incidents
    description: Security incidents, NIS2 notification deadlines, reports and closure.
  - name: Tickets
    description: IT ticket system, SLA, comments, bulk operations and restore.
  - name: ISMS Operations
    description: Canonical ISMS operations resource API served by the isms-operations mount.
  - name: Audit
    description: Audit programs, audit plans, findings, audit kits and CAPA generation.
  - name: Management Review
    description: Management reviews, review actions, approvals and security objectives.
  - name: Compliance
    description: Compliance-oriented reports, report definitions, export jobs and reminders.
  - name: Supply Chain
    description: Supplier register, assessments, contract/risk relations and NIS2 review reminders.
  - name: BCM
    description: Business impact analyses, business continuity plans and BCP exercises.
  - name: Training
    description: Training courses, assignments, completions and acknowledgements.
  - name: KPIs
    description: Metric definitions, metric values and KRI/KPI dashboards.
  - name: Reporting
    description: Report definitions and report runs.
  - name: Workflows
    description: Generic workflow definitions, instances, transitions and actions.
  - name: Frameworks
    description: Framework versions, requirement imports and version comparison.
  - name: SoA
    description: Statement of Applicability lifecycle, pending justifications, submit and approve.
  - name: Evidence
    description: Evidence metadata, relations and audit packages.
  - name: Documents
    description: Controlled policy documents, transitions, acknowledgements and reviews.
  - name: Organization
    description: Organization unit and ISMS scope pickers.
  - name: Users
    description: User lookup endpoints for owner/responsible selection.
  - name: Authentication
    description: Local authentication, sessions, MFA and password flows.
  - name: OIDC
    description: OpenID Connect configuration and login flows.
  - name: Admin
    description: Administrative configuration, roles, groups and integration settings.
  - name: Navigation
    description: Global and personal navigation configuration.
  - name: Health
    description: Liveness and readiness probes.
  - name: System
    description: Root-level system endpoints and API info.
  - name: Metrics
    description: Prometheus metrics endpoint (server root, outside /api/v1).
  - name: Contracts
    description: Contract domain routes.
  - name: Licenses
    description: License domain routes.
  - name: Processes
    description: Business process routes.
  - name: Treatments
    description: Risk treatment routes.
  - name: Methods
    description: Risk method routes.
  - name: Imports
    description: Import sources, runs, conflicts and field locks.
  - name: Intune
    description: Microsoft Intune integration configuration, sync and devices.
  - name: VMware
    description: VMware vCenter credential and server administration.
  - name: Proxmox
    description: Proxmox credential and server administration.
  - name: Webhooks
    description: Webhook configuration, deliveries and secret rotation.
  - name: Service Accounts
    description: Service-account management, token rotation and scope contracts.
  - name: Action Center
    description: Aggregated action center views.
  - name: Search
    description: Global full-text search.
  - name: Catalogs
    description: Control catalog and NIS2 article catalog routes.
  - name: NIS2
    description: NIS2 assessments, registrations, questionnaires and compliance crosswalk.
  - name: Cost Planning
    description: Cost planning years, plans, items and reports.
  - name: Knowledge
    description: Knowledge articles (base knowledge management).

paths:
  # ==================== ISMS operations (canonical mount) ====================
  # Canonical domain-oriented ISMS operations API. Frontend services call
  # `/isms-operations/*`; the route registry records this as the alias mount of
  # the same phase6Router instance. Permission annotations reflect the route
  # guards in backend/src/routes/phase6.routes.ts.
  /isms-operations/resources:
    get:
      summary: List available ISMS operations resources
      tags: [ISMS Operations]
      security: [{ bearerAuth: [] }]
      x-permission: authenticated-user
      responses:
        '200':
          description: Resource keys supported by the generic ISMS operations API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Phase6ResourceListResponse'
        '401': { description: Authentication required }

  /isms-operations/suppliers:
    get:
      summary: List suppliers with filters
      tags: [Supply Chain]
      security: [{ bearerAuth: [] }]
      x-permission: suppliers.read
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: search, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: criticality, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Paginated supplier list (also serves the entity picker)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierListResponse'
        '403': { description: Missing permission suppliers.read }
    post:
      summary: Create a supplier
      tags: [Supply Chain]
      security: [{ bearerAuth: [] }]
      x-permission: suppliers.write
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, format: uuid }
          description: Optional idempotency key; a replay of the same request returns the stored response instead of a duplicate write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierCreateRequest'
      responses:
        '201':
          description: Created supplier (may include an NIS2 risk assessment warning)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierResponse'
        '403': { description: Missing permission suppliers.write }
        '400': { description: VALIDATION_ERROR }

  /isms-operations/suppliers/{id}:
    patch:
      summary: Update a supplier
      description: >
        Accepts the route-local free-form body (AnyBodySchema); status changes
        are validated against the supplier transition rules server-side.
      tags: [Supply Chain]
      security: [{ bearerAuth: [] }]
      x-permission: suppliers.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, format: uuid }
          description: Optional idempotency key; a replay of the same request returns the stored response instead of a duplicate write
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Updated supplier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierResponse'
        '400': { description: VALIDATION_ERROR (e.g. invalid status transition) }
        '404': { description: Supplier not found }

  /isms-operations/suppliers/{id}/archive:
    post:
      summary: Archive a supplier
      description: Archiving is rejected while draft or under_review assessments still exist.
      tags: [Supply Chain]
      security: [{ bearerAuth: [] }]
      x-permission: suppliers.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, format: uuid }
          description: Optional idempotency key; a replay of the same request returns the stored response instead of a duplicate write
      responses:
        '200':
          description: Archived supplier (isArchived true, status archived)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierResponse'
        '400': { description: Supplier is already archived or has active assessments }
        '404': { description: Supplier not found }

  /isms-operations/suppliers/{id}/contracts/{relationId}:
    delete:
      summary: Remove a contract relation from a supplier
      tags: [Supply Chain]
      security: [{ bearerAuth: [] }]
      x-permission: suppliers.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: relationId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, format: uuid }
          description: Optional idempotency key; a replay of the same request returns the stored 204 instead of a duplicate delete
      responses:
        '204': { description: Supplier contract relation removed }
        '404': { description: Supplier or contract relation not found }

  /isms-operations/suppliers/{id}/risks/{relationId}:
    delete:
      summary: Remove a risk relation from a supplier
      tags: [Supply Chain]
      security: [{ bearerAuth: [] }]
      x-permission: suppliers.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: relationId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, format: uuid }
          description: Optional idempotency key; a replay of the same request returns the stored 204 instead of a duplicate delete
      responses:
        '204': { description: Supplier risk relation removed }
        '404': { description: Supplier or risk relation not found }

  /isms-operations/suppliers/overview:
    get:
      summary: Supply-chain dependency overview (NIS2 Art. 21(2)(d))
      tags: [Supply Chain]
      security: [{ bearerAuth: [] }]
      x-permission: suppliers.read
      parameters:
        - { name: criticality, in: query, required: false, schema: { type: string } }
        - { name: nis2Relevant, in: query, required: false, schema: { type: string, enum: ['true'] } }
        - { name: search, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Suppliers with linked contracts, risks, latest assessment and review status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplyChainOverviewResponse'

  /isms-operations/suppliers/reviews-due:
    get:
      summary: List suppliers with due or overdue reviews (NIS2 Art. 26/30 review reminders)
      description: >
        Supplier review reminder oversight: returns non-archived suppliers whose
        nextReviewDate falls at or before the end of the look-ahead window
        (days, default 30). Supplier reviews are surfaced data-driven by the
        reminder subsystem (suppliers is registered in PHASE6_MODEL_MAP with
        dueField nextReviewDate); no per-supplier reminder records are created.
      tags: [Supply Chain]
      security: [{ bearerAuth: [] }]
      x-permission: suppliers.read
      parameters:
        - { name: days, in: query, required: false, description: Look-ahead window in days (0 = overdue only), schema: { type: integer, minimum: 0, maximum: 365, default: 30 } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Paginated suppliers with reviewOverdue flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierReviewsDueResponse'
        '400': { description: VALIDATION_ERROR (e.g. days out of range) }

  /isms-operations/suppliers/{id}/detail:
    get:
      summary: Read supplier workflow context (assessments, relations, CAPAs, history)
      tags: [Supply Chain]
      security: [{ bearerAuth: [] }]
      x-permission: suppliers.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Supplier detail with linked workflow data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierDetailResponse'
        '404': { description: Supplier not found }

  /isms-operations/suppliers/{id}/contracts:
    post:
      summary: Link a contract relation to a supplier
      tags: [Supply Chain]
      security: [{ bearerAuth: [] }]
      x-permission: suppliers.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, format: uuid }
          description: Optional idempotency key; a replay of the same request returns the stored response instead of a duplicate relation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierRelationRequest'
      responses:
        '201':
          description: Created supplier contract relation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierContractRelationResponse'

  /isms-operations/suppliers/{id}/risks:
    post:
      summary: Link a risk relation to a supplier
      tags: [Supply Chain]
      security: [{ bearerAuth: [] }]
      x-permission: suppliers.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, format: uuid }
          description: Optional idempotency key; a replay of the same request returns the stored response instead of a duplicate relation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierRelationRequest'
      responses:
        '201':
          description: Created supplier risk relation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierRiskRelationResponse'

  /isms-operations/suppliers/{id}/assessments:
    get:
      summary: List supplier assessments
      tags: [Supply Chain]
      security: [{ bearerAuth: [] }]
      x-permission: suppliers.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Supplier assessments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierAssessmentListResponse'
    post:
      summary: Create a supplier assessment
      tags: [Supply Chain]
      security: [{ bearerAuth: [] }]
      x-permission: suppliers.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, format: uuid }
          description: Optional idempotency key; a replay of the same request returns the stored response instead of a duplicate assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierAssessmentCreateRequest'
      responses:
        '201':
          description: Created supplier assessment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierAssessmentResponse'

  /isms-operations/supplier-assessments/{id}:
    get:
      summary: Read a supplier assessment
      tags: [Supply Chain]
      security: [{ bearerAuth: [] }]
      x-permission: suppliers.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Supplier assessment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierAssessmentResponse'
        '404': { description: Supplier assessment not found }
    patch:
      summary: Update a supplier assessment
      description: Accepts SupplierAssessmentSchema.partial(); status changes are validated server-side.
      tags: [Supply Chain]
      security: [{ bearerAuth: [] }]
      x-permission: suppliers.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, format: uuid }
          description: Optional idempotency key; a replay of the same request returns the stored response instead of a duplicate write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierAssessmentUpdateRequest'
      responses:
        '200':
          description: Updated supplier assessment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierAssessmentResponse'
        '400': { description: VALIDATION_ERROR (e.g. invalid status transition) }
        '404': { description: Supplier assessment not found }

  /isms-operations/bias:
    get:
      summary: List business impact analyses
      tags: [BCM]
      security: [{ bearerAuth: [] }]
      x-permission: bcm.read
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: search, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Paginated business impact analysis list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BiaListResponse'
    post:
      summary: Create a business impact analysis
      tags: [BCM]
      security: [{ bearerAuth: [] }]
      x-permission: bcm.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BiaCreateRequest'
      responses:
        '201':
          description: Created business impact analysis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BiaResponse'

  /isms-operations/bias/{id}/detail:
    get:
      summary: Read a business impact analysis with asset links and dependent BCPs
      tags: [BCM]
      security: [{ bearerAuth: [] }]
      x-permission: bcm.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: BIA detail (bia, asset links, dependent BCPs)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BiaDetailResponse'
        '404': { description: Business impact analysis not found }

  /isms-operations/bias/{id}:
    patch:
      summary: Update a business impact analysis
      description: Accepts BiaWriteSchema.partial().
      tags: [BCM]
      security: [{ bearerAuth: [] }]
      x-permission: bcm.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BiaCreateRequest'
      responses:
        '200':
          description: Updated business impact analysis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BiaResponse'
        '404': { description: Business impact analysis not found }

  /isms-operations/bcps:
    get:
      summary: List business continuity plans
      tags: [BCM]
      security: [{ bearerAuth: [] }]
      x-permission: bcm.read
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Paginated business continuity plan list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BcpListResponse'
    post:
      summary: Create a business continuity plan
      tags: [BCM]
      security: [{ bearerAuth: [] }]
      x-permission: bcm.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BcpCreateRequest'
      responses:
        '201':
          description: Created business continuity plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BcpResponse'

  /isms-operations/bcps/{id}/detail:
    get:
      summary: Read a business continuity plan with linked BIA, exercises and CAPAs
      tags: [BCM]
      security: [{ bearerAuth: [] }]
      x-permission: bcm.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: BCP detail (bcp, linked bia, exercises, corrective actions)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BcpDetailResponse'
        '404': { description: Business continuity plan not found }

  /isms-operations/bcps/{id}:
    patch:
      summary: Update a business continuity plan
      description: Accepts BcpWriteSchema.partial().
      tags: [BCM]
      security: [{ bearerAuth: [] }]
      x-permission: bcm.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BcpCreateRequest'
      responses:
        '200':
          description: Updated business continuity plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BcpResponse'
        '400': { description: VALIDATION_ERROR (referenced BIA not found) }
        '404': { description: Business continuity plan not found }

  /isms-operations/bcp-exercises:
    get:
      summary: List BCP exercises
      tags: [BCM]
      security: [{ bearerAuth: [] }]
      x-permission: bcm.read
      responses:
        '200':
          description: BCP exercise list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BcpExerciseListResponse'
    post:
      summary: Create a BCP exercise
      tags: [BCM]
      security: [{ bearerAuth: [] }]
      x-permission: bcm.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BcpExerciseCreateRequest'
      responses:
        '201':
          description: Created BCP exercise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BcpExerciseResponse'

  /isms-operations/bcp-exercises/{id}/detail:
    get:
      summary: Read a BCP exercise with its plan and corrective actions
      tags: [BCM]
      security: [{ bearerAuth: [] }]
      x-permission: bcm.read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Exercise detail (exercise, bcp, corrective actions)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BcpExerciseDetailResponse'
        '404': { description: BCP exercise not found }

  /isms-operations/bcp-exercises/{id}:
    patch:
      summary: Update a BCP exercise
      description: Accepts ExerciseWriteSchema.partial().
      tags: [BCM]
      security: [{ bearerAuth: [] }]
      x-permission: bcm.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BcpExerciseCreateRequest'
      responses:
        '200':
          description: Updated BCP exercise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BcpExerciseResponse'
        '404': { description: BCP exercise not found }

  /isms-operations/bcp-exercises/{id}/corrective-actions:
    post:
      summary: Create a corrective action from a BCP exercise
      description: >
        Only allowed for executed or completed exercises. findingIndex optionally
        selects a recorded exercise finding to seed title, description and priority.
      tags: [BCM]
      security: [{ bearerAuth: [] }]
      x-permission: correctiveActions.write
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapaFromExerciseRequest'
      responses:
        '201':
          description: Created corrective action
          content:
            application/json:
