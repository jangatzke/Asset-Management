  /controls/soa/pending-justifications:
    get:
      summary: Audit report of SoA items with pending justifications before submission
      description: >
        Read-only report object (Phase 3.3). Flags SoA items in non-approved,
        non-immutable versions that cannot be submitted as-is: empty justification,
        the ISO27001_SOA_PENDING_JUSTIFICATION placeholder still present, or an
        applicability decision still under review. Returns an empty structure
        (`totalPending: 0`, `entries: []`) instead of an error when no data exists.
        Not a D1 list: no pagination header, no idempotency.
      tags: [SoA]
      security: [{ bearerAuth: [] }]
      x-permission: controls.read
      parameters:
        - { name: scopeId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Pending-justification report
          content:
            application/json:
              schema:
                type: object
                properties:
                  generatedAt: { type: string, format: date-time }
                  totalPending: { type: integer }
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        soaItemId: { type: string }
                        soaId: { type: string }
                        soaVersion: { type: integer }
                        approvalStatus: { type: string }
                        scopeId: { type: string }
                        controlId: { type: string, nullable: true }
                        catalogId: { type: string, nullable: true }
                        controlTitle: { type: string, nullable: true }
                        requirementId: { type: string, nullable: true }
                        applicability: { type: string }
                        reason:
                          type: string
                          enum: [placeholder_pending_justification, pending_applicability_decision, empty_justification]
                required: [generatedAt, totalPending, entries]

