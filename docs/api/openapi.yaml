  # ==================== Knowledge ====================
  /knowledge:
    get:
      summary: List knowledge articles (paginated envelope + X-Total-Count)
      description: Returns the locked pagination envelope { data, pagination } used by
        assets, tickets, risks, controls and incidents, and sets X-Total-Count from
        pagination.total. Filters are unchanged; default ordering stays updatedAt desc.
        Breaking change (improvement #9): the response is no longer a bare array.
      tags: [Knowledge]
      security: [{ bearerAuth: [] }]
      x-permission: documents.read
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: search
          in: query
          schema: { type: string, maxLength: 255 }
          description: Case-insensitive match on title, summary, content and tags
        - name: category
          in: query
          schema: { type: string, enum: [general, incident, risk, control, supplier, nis2, service] }
        - name: status
          in: query
          schema: { type: string, maxLength: 50 }
          description: Article status filter (draft, published, archived)
        - name: tag
          in: query
          schema: { type: string, maxLength: 50 }
        - name: relatedEntityId
          in: query
          schema: { type: string, maxLength: 120 }
      responses:
        '200':
          description: Paginated knowledge article listing
          headers:
            X-Total-Count: { $ref: '#/components/headers/XTotalCount' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeArticleListResponse'
        '400':
          description: Invalid query parameters (Zod VALIDATION_ERROR)
    post:
      summary: Create knowledge article
      tags: [Knowledge]
      security: [{ bearerAuth: [] }]
      x-permission: documents.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '201': { description: Created knowledge article }

  /knowledge/{id}:
    get:
      summary: Read knowledge article and count the view once per access
      tags: [Knowledge]
      security: [{ bearerAuth: [] }]
      x-permission: documents.read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Knowledge article }
    patch:
      summary: Update knowledge article
      tags: [Knowledge]
      security: [{ bearerAuth: [] }]
      x-permission: documents.write
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
