# ==================== Components ====================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    FrameworkImport:
      type: object
      required: [framework, version, licenseInfo, requirements]
      properties:
        framework:
          type: object
          required: [name, code]
          properties:
            name: { type: string }
            code: { type: string }
            description: { type: string }
            publisher: { type: string }
        version: { type: string }
        publicationDate: { type: string, format: date-time }
        licenseInfo: { type: string }
        requirements:
          type: array
          items:
            type: object
            required: [key, title, text]
            properties:
              key: { type: string }
              title: { type: string }
              text: { type: string }
              section: { type: string }
              clauseNumber: { type: string }
              licenseNotice: { type: string }
    ControlImplementationInput:
      type: object
      required: [controlId, responsibleUserId]
      properties:
        controlId: { type: string, format: uuid }
        scopeId: { type: string, format: uuid }
        organizationUnitId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        responsibleUserId: { type: string }
        maturityLevel: { type: integer, minimum: 0, maximum: 5 }
        testMethod: { type: string }
        testFrequency: { type: string }
        nextTestDate: { type: string, format: date-time }
        requirementIds: { type: array, items: { type: string, format: uuid } }
    RiskControlInput:
      type: object
      required: [riskId, controlImplementationId, role, mitigationDimension]
      description: Canonical Risk-Control link; replaces deprecated direct arrays such as existingControls, relatedRiskIds, controlIds and riskIds.
      properties:
        riskId: { type: string, format: uuid }
        controlImplementationId: { type: string, format: uuid }
        role: { type: string, enum: [preventive, detective, corrective, recovery, compensating] }
        mitigationDimension: { type: string, enum: [likelihood, impact, both] }
        isKeyControl: { type: boolean, default: false }
        status: { type: string, default: active }
    RiskControlAssessmentInput:
      type: object
      required: [riskControlId, riskAssessmentVersionId, effectivenessStatus, justification, assessedBy]
      properties:
        riskControlId: { type: string, format: uuid }
        riskAssessmentVersionId: { type: string, format: uuid }
        effectivenessStatus: { type: string, enum: [not_verified, ineffective, partially_effective, effective] }
        effectivenessRating: { type: integer, minimum: 0, maximum: 100 }
        likelihoodReduction: { type: integer }
        impactReduction: { type: integer }
        justification: { type: string }
        assessedBy: { type: string }
        evidenceLinks:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceLinkInput'
    ControlTestInput:
      type: object
      required: [controlImplementationId, testType, testedBy, result]
      properties:
        controlImplementationId: { type: string, format: uuid }
        testType: { type: string }
        testMethod: { type: string }
        testedBy: { type: string }
        testedAt: { type: string, format: date-time }
        result: { type: string }
        effectivenessRating: { type: integer, minimum: 0, maximum: 100 }
        findings: { type: string }
        evidenceRequired: { type: boolean }
        nextTestDate: { type: string, format: date-time }
        evidenceLinks:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceLinkInput'
    EvidenceLinkInput:
      type: object
      required: [evidenceId]
      properties:
        evidenceId: { type: string, format: uuid }
        relationType: { type: string, default: supports }
    SoAInput:
      type: object
      required: [frameworkId, frameworkVersion, scopeId]
      properties:
        frameworkId: { type: string, format: uuid }
        frameworkVersion: { type: string }
        scopeId: { type: string }
        items:
          type: array
          items:
            type: object
            required: [justification]
            properties:
              requirementId: { type: string, format: uuid }
              controlId: { type: string, format: uuid }
              applicability: { type: string, enum: [applicable, not_applicable, under_review] }
              justification: { type: string }
              implementationStatus: { type: string }
              controlImplementationIds: { type: array, items: { type: string, format: uuid } }
    EvidenceInput:
      type: object
      required: [title, evidenceType, classification, responsibleId, fileHash]
      properties:
        title: { type: string }
        evidenceType: { type: string }
        classification: { type: string }
        fileHash: { type: string, minLength: 64, maxLength: 64 }
        links:
          type: array
          description: Generic evidence associations replacing relatedControlIds/relatedRiskIds mirror arrays.
          items:
            type: object
            required: [entityType, entityId]
            properties:
              entityType: { type: string, enum: [Control, Risk, Asset, SoAItem, Document, RiskControlAssessment, ControlTest] }
              entityId: { type: string }
              relationType: { type: string }
    IncidentInput:
      type: object
      required: [title, description, detectionTime, knowledgeTime, incidentManagerId]
      properties:
        title: { type: string }
        description: { type: string }
        detectionTime: { type: string, format: date-time }
        knowledgeTime: { type: string, format: date-time }
        severity: { type: string, enum: [low, medium, high, critical] }
        availabilityImpact: { type: string, enum: [none, low, medium, high] }
        personalDataImpact: { type: boolean }
        hasCrossBorderImpact: { type: boolean }
        incidentManagerId: { type: string }
    KnowledgeTimeChangeInput:
      type: object
      required: [knowledgeTime, reason]
      properties:
        knowledgeTime: { type: string, format: date-time }
        reason: { type: string }
    IncidentReportInput:
      type: object
      required: [reportType, content, authorId]
      properties:
        reportType: { type: string, enum: [early_warning_24h, incident_notification_72h, interim_report, monthly_final_report] }
        title: { type: string }
        content: { type: object, additionalProperties: true }
        authorId: { type: string }
        recipient: { type: string }
        submissionMethod: { type: string }
        submissionProof: { type: string }
    IncidentClosureInput:
      type: object
      properties:
        rootCause: { type: string }
        lessonsLearned: { type: string }
        measuresEvaluation: { type: string }
        closureSummary: { type: string }
    Nis2AssessmentInput:
      type: object
      required: [answers]
      properties:
        organizationUnitId: { type: string, format: uuid }
        questionnaireVersion: { type: string }
        answers: { type: object, additionalProperties: true }
        justification: { type: string }
    Nis2RegistrationInput:
      type: object
      required: [entityType, deadline]
      properties:
        assessmentId: { type: string, format: uuid }
        entityType: { type: string }
        registrationDate: { type: string, format: date-time }
        deadline: { type: string, format: date-time }
        contactPerson: { type: string }
        contactDetails: { type: string }
        submittedData: { type: object, additionalProperties: true }
        submissionProof: { type: string }
        bsiConfirmation: { type: string }
        responsibleId: { type: string }
        fileHash: { type: string, minLength: 64, maxLength: 64 }
        hashAlgorithm: { type: string, default: sha256 }
        retentionUntil: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        deleteProtected: { type: boolean }
        links:
          type: array
          items:
            type: object
            properties:
              entityType: { type: string, enum: [Control, Risk, Asset, SoAItem, Document] }
              entityId: { type: string }
    PolicyDocumentInput:
      type: object
      required: [title, documentType, ownerId, content]
      properties:
        title: { type: string }
        documentType: { type: string }
        ownerId: { type: string }
        reviewerId: { type: string }
        approverId: { type: string }
        nextReviewDate: { type: string, format: date-time }
        reviewIntervalDays: { type: integer }
        content: { type: string }
        changeLog: { type: string }

    IntuneConfigUpdate:
      type: object
      properties:
        enabled: { type: boolean }
        fullSyncIntervalHours: { type: integer, minimum: 1, maximum: 168 }
        incrementalSyncIntervalMinutes: { type: integer, minimum: 10, maximum: 1440 }
        gracePeriodHours: { type: integer, minimum: 1 }
        maxRetryAttempts: { type: integer, minimum: 1, maximum: 10 }
        retryDelayMs: { type: integer, minimum: 0 }
        batchSize: { type: integer, minimum: 1 }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
  
    RegisterInput:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12 }
        firstName: { type: string }
        lastName: { type: string }
        phoneNumber: { type: string }
        organizationUnitId: { type: string }
  
    UpdateUserInput:
      type: object
      properties:
        firstName: { type: string }
        lastName: { type: string }
        phoneNumber: { type: string }
        organizationUnitId: { type: string }
        isActive: { type: boolean }
  
    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
        token: { type: string, description: JWT Bearer Token }
  
    UserResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        displayId: { type: string }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        phoneNumber: { type: string, nullable: true }
        isActive: { type: boolean }
        roles:
          type: array
          items: { type: string }
        language: { type: string, nullable: true }
        darkMode: { type: boolean, nullable: true }
        createdAt: { type: string, format: date-time }
  
    RoleResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        isBuiltIn: { type: boolean }
        permissions: { type: object }
        canAccessAdmin: { type: boolean }
        entityPermissions:
          type: object
          properties:
            assets: { type: string, enum: [none, readonly, readwrite] }
            risks: { type: string, enum: [none, readonly, readwrite] }
            controls: { type: string, enum: [none, readonly, readwrite] }
            incidents: { type: string, enum: [none, readonly, readwrite] }
  
    CreateRoleInput:
      type: object
      required: [name, permissions]
      properties:
        name: { type: string }
        description: { type: string }
        permissions: { type: array, items: { type: object } }
        canAccessAdmin: { type: boolean, default: false }
        entityPermissions:
          $ref: '#/components/schemas/EntityPermissions'
  
    EntityPermissions:
      type: object
      properties:
        assets: { type: string, enum: [none, readonly, readwrite] }
        risks: { type: string, enum: [none, readonly, readwrite] }
        controls: { type: string, enum: [none, readonly, readwrite] }
        incidents: { type: string, enum: [none, readonly, readwrite] }
  
    GroupResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
  
    OidcConfigResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        enabled: { type: boolean }
        providerName: { type: string }
        alloweEmailDomains:
          type: array
          items: { type: string }
        autoProvisioning: { type: boolean }
        defaultRoleForNewUsers: { type: string }
        enableLocalLogin: { type: boolean }
  
    OidcConfigInput:
      type: object
      properties:
        enabled: { type: boolean }
        providerName: { type: string }
        tenantId: { type: string }
        clientId: { type: string }
        clientSecret: { type: string }
        redirectUri: { type: string }
        allowedEmailDomains:
          type: array
          items: { type: string }
        autoProvisioning: { type: boolean }
        defaultRoleForNewUsers: { type: string }
        enableLocalLogin: { type: boolean }
  
    AssetTypeResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        category: { type: string }
        inventoryEnabled: { type: boolean }
        inventoryPattern: { type: string, nullable: true }
        inventoryNextSequence: { type: integer }
        isArchived: { type: boolean }
        subtypes:
          type: array
          items:
            $ref: '#/components/schemas/AssetSubtypeResponse'
    AssetSubtypeInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        inventoryEnabled: { type: boolean, nullable: true }
        inventoryPattern: { type: string, nullable: true }
    AssetSubtypeResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        assetTypeId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        inventoryEnabled: { type: boolean, nullable: true }
        inventoryPattern: { type: string, nullable: true }
        isArchived: { type: boolean }
    AssetInput:
      type: object
      required: [name, assetTypeId]
      properties:
        name: { type: string }
        description: { type: string }
        assetTypeId: { type: string, format: uuid }
        assetSubtypeId: { type: string, format: uuid }
        inventoryNumber: { type: string, description: Optional manual number; otherwise generated from subtype/type inventory pattern when enabled. }
        criticality: { type: string, enum: [low, medium, high, critical] }
        networkAddresses:
          type: array
          items:
            type: object
            properties:
              address: { type: string }
              type: { type: string, enum: [ipv4, ipv6, cidr, hostname] }
              primary: { type: boolean }
  
    AssetResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        displayId: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        assetTypeId: { type: string }
        assetSubtypeId: { type: string, nullable: true }
        inventoryNumber: { type: string, nullable: true }
        criticality: { type: string }
        lifecycleStatus: { type: string }
        confidentialityNeed: { type: string }
        integrityNeed: { type: string }
        availabilityNeed: { type: string }
  
    PaginatedResponse:
      type: object
      properties:
        data: { type: array, items: {} }
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
        totalPages: { type: integer }

# ==================== Phase 8: API, Betrieb und Nachweise ====================

  # ==================== Health & System (Phase 8) ====================
  /health/live:
    get:
      summary: Liveness probe — server is running
      tags: [System-Phase8]
      responses:
        '200':
          description: Server is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  uptime: { type: integer, description: Uptime in seconds }
                  timestamp: { type: string, format: date-time }

  /health/ready:
    get:
      summary: Readiness probe — server is ready to serve requests
      tags: [System-Phase8]
      responses:
        '200':
          description: Server is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ready, not_ready] }
                  ready: { type: boolean }
                  uptime: { type: integer }
                  timestamp: { type: string, format: date-time }
                  checks:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        status: { type: string, enum: [healthy, unhealthy] }
                        duration: { type: integer }

  /metrics:
    get:
      summary: Prometheus-compatible metrics endpoint
      tags: [System-Phase8]
      responses:
        '200':
          description: Metrics in text/plain format
          content:
            text/plain:
              schema:
                type: string

  # ==================== Webhooks (Phase 8) ====================
  /webhooks:
    get:
      summary: List webhooks
      tags: [Webhooks-Phase8]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Webhook list }
    post:
      summary: Create webhook
      tags: [Webhooks-Phase8]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url]
              properties:
                name: { type: string }
                description: { type: string }
                url: { type: string, format: uri }
                events:
                  type: array
                  items: { type: string }
                maxRetries: { type: integer, default: 3 }
                timeoutMs: { type: integer, default: 10000 }
      responses:
        '201': { description: Webhook created (secret returned once) }

  /webhooks/{id}:
    get:
      summary: Get webhook by ID
      tags: [Webhooks-Phase8]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Webhook details (secret excluded) }
    patch:
      summary: Update webhook
      tags: [Webhooks-Phase8]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                url: { type: string, format: uri }
                events:
                  type: array
                  items: { type: string }
                maxRetries: { type: integer }
                timeoutMs: { type: integer }
      responses:
        '200': { description: Updated webhook }
    delete:
      summary: Soft-delete webhook
      tags: [Webhooks-Phase8]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Webhook archived }

  /webhooks/{id}/test:
    post:
      summary: Test webhook delivery with sample payload
      tags: [Webhooks-Phase8]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Delivery result }

  /webhooks/broadcast:
    post:
      summary: Broadcast event to all matching webhooks
      tags: [Webhooks-Phase8]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventType, data]
              properties:
                eventType: { type: string }
                data: { type: object }
      responses:
        '200': { description: Delivery results per webhook }

  # ==================== Service Accounts (Phase 8) ====================
  /service-accounts:
    get:
      summary: List service accounts
      tags: [ServiceAccounts-Phase8]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Service account list }
    post:
      summary: Create service account with access token
      tags: [ServiceAccounts-Phase8]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                userId: { type: string, format: uuid }
                scopes:
                  type: array
                  items: { type: string }
                expiresAt: { type: string, format: date-time }
      responses:
        '201': { description: Service account created (token returned once) }

  /service-accounts/{id}:
    get:
      summary: Get service account by ID
      tags: [ServiceAccounts-Phase8]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Service account details }
    patch:
      summary: Update service account
      tags: [ServiceAccounts-Phase8]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                scopes:
                  type: array
                  items: { type: string }
                expiresAt: { type: string, format: date-time }
                isActive: { type: boolean }
      responses:
        '200': { description: Updated service account }
    delete:
      summary: Soft-delete service account
      tags: [ServiceAccounts-Phase8]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Service account archived }

  /service-accounts/{id}/regenerate-token:
    post:
      summary: Regenerate access token for service account
      tags: [ServiceAccounts-Phase8]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: New token returned (once) }

  /service-accounts/{id}/tokens:
    get:
      summary: Get service account tokens (masked)
      tags: [ServiceAccounts-Phase8]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Token metadata (no secrets) }

  /service-accounts/auth:
    post:
      summary: Authenticate service account with access token
      tags: [ServiceAccounts-Phase8]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accessToken]
              properties:
                accessToken: { type: string }
      responses:
        '200': { description: Authentication successful }
        '401': { description: Invalid access token }

  # ==================== API Headers (Phase 8) ====================
  /api-info:
    get:
      summary: API information including supported headers and features
      tags: [System-Phase8]
      responses:
        '200':
          description: API feature flags
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  features:
                    type: object
                    properties:
                      correlationId: { type: boolean }
                      etag: { type: boolean }
                      idempotencyKeys: { type: boolean }
                      webhooks: { type: boolean }
                      serviceAccounts: { type: boolean }
                      structuredLogging: { type: boolean }
                      metrics: { type: boolean }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # ==================== Phase 8 Schemas ====================
  WebhookInput:
    type: object
    required: [name, url]
    properties:
      name: { type: string }
      description: { type: string }
      url: { type: string, format: uri }
      events:
        type: array
        items:
          type: string
          enum:
            - asset.created
            - asset.updated
            - asset.deleted
            - risk.created
            - risk.updated
            - risk.assessed
            - control.created
            - control.updated
            - control.verified
            - incident.created
            - incident.updated
            - incident.closed
            - user.created
            - user.updated
            - user.deleted
            - system.health.check
      maxRetries: { type: integer, default: 3 }
      timeoutMs: { type: integer, default: 10000 }

  WebhookResponse:
    type: object
    properties:
      id: { type: string, format: uuid }
      displayId: { type: string }
      name: { type: string }
      description: { type: string }
      url: { type: string, format: uri }
      events:
        type: array
        items: { type: string }
      isActive: { type: boolean }
      isArchived: { type: boolean }
      lastDeliveryStatus: { type: string, enum: [success, failed, pending] }
      lastDeliveredAt: { type: string, format: date-time }
      failureCount: { type: integer }
      maxRetries: { type: integer }
      timeoutMs: { type: integer }
      createdAt: { type: string, format: date-time }
      updatedAt: { type: string, format: date-time }

  ServiceAccountInput:
    type: object
    required: [name]
    properties:
      name: { type: string }
      description: { type: string }
      userId: { type: string, format: uuid }
      scopes:
        type: array
        items: { type: string }
      expiresAt: { type: string, format: date-time }

  ServiceAccountResponse:
    type: object
    properties:
      id: { type: string, format: uuid }
      displayId: { type: string }
      name: { type: string }
      description: { type: string }
      userId: { type: string, format: uuid }
      scopes:
        type: array
        items: { type: string }
      isActive: { type: boolean }
      isArchived: { type: boolean }
      lastUsedAt: { type: string, format: date-time }
      expiresAt: { type: string, format: date-time }
      createdAt: { type: string, format: date-time }
      updatedAt: { type: string, format: date-time }

  IdempotencyErrorResponse:
    type: object
    properties:
      error: { type: string }
      message: { type: string }

  OptimisticLockError:
    type: object
    properties:
      error: { type: string, example: Precondition Failed }
      message: { type: string }
      currentVersion: { type: integer }
      currentEtag: { type: string }

  ApiScopesErrorResponse:
    type: object
    properties:
      error: { type: string }
      message: { type: string }
      missingScopes:
        type: array
        items: { type: string }
      grantedScopes:
        type: array
        items: { type: string }

  WebhookDeliveryResult:
    type: object
    properties:
      success: { type: boolean }
      statusCode: { type: integer }
      errorMessage: { type: string }
      durationMs: { type: integer }
      attemptNumber: { type: integer }

  HealthStatus:
    type: object
    properties:
      status: { type: string, enum: [ok, degraded] }
      timestamp: { type: string, format: date-time }
      uptime: { type: integer }

  ReadinessStatus:
    type: object
    properties:
      status: { type: string, enum: [ready, not_ready] }
      ready: { type: boolean }
      uptime: { type: integer }
      timestamp: { type: string, format: date-time }
      checks:
        type: object
        additionalProperties:
          type: object
          properties:
            status: { type: string, enum: [healthy, unhealthy] }
            duration: { type: integer }

  LivenessStatus:
    type: object
    properties:
      status: { type: string, example: ok }
      uptime: { type: integer }
      timestamp: { type: string, format: date-time }

  ApiInfoResponse:
    type: object
    properties:
      version: { type: string }
      features:
        type: object
        properties:
          correlationId: { type: boolean }
          etag: { type: boolean }
          idempotencyKeys: { type: boolean }
          webhooks: { type: boolean }
          serviceAccounts: { type: boolean }
          structuredLogging: { type: boolean }
          metrics: { type: boolean }

  # ==================== Phase 8 Headers ====================
  responseHeaders:
    X-Correlation-Id:
      schema: { type: string, format: uuid }
      description: Correlation ID for request tracing
    ETag:
      schema: { type: string }
      description: Entity tag for conditional requests
    X-Resource-Version:
      schema: { type: integer }
      description: Resource version for optimistic locking
    X-Total-Count:
      schema: { type: integer }
      description: Total number of items (pagination)
    X-Page:
      schema: { type: integer }
      description: Current page number
    X-Limit:
      schema: { type: integer }
      description: Items per page
    X-Total-Pages:
      schema: { type: integer }
      description: Total number of pages
    Link:
      schema: { type: string }
      description: Pagination links (rel="prev", rel="next")
    X-Idempotency-Cache:
      schema: { type: string, enum: [hit] }
      description: Present when idempotency key was cached
    X-RateLimit-Limit:
      schema: { type: integer }
      description: Rate limit bucket size
    X-RateLimit-Remaining:
      schema: { type: integer }
      description: Remaining requests in current window
    X-RateLimit-Reset:
      schema: { type: integer }
      description: Seconds until rate limit resets

  schemas:
    # ==================== Phase 8 Health/Metrics Schemas ====================
    
    LiveHealthResponse:
      type: object
      properties:
        status: { type: string, example: ok }
        uptime: { type: integer, description: Server uptime in seconds }
        timestamp: { type: string, format: date-time }

    ReadyHealthCheck:
      type: object
      properties:
        status: { type: string, enum: [healthy, unhealthy] }
        duration: { type: integer, description: Check duration in ms }

    ReadyHealthResponse:
      type: object
      properties:
        status: { type: string, example: ready }
        ready: { type: boolean }
        uptime: { type: integer }
        timestamp: { type: string, format: date-time }
        checks:
          type: object
          properties:
            database:
              $ref: '#/components/schemas/ReadyHealthCheck'
            webhookQueue:
              $ref: '#/components/schemas/ReadyHealthCheck'

    ApiInfoResponse:
      type: object
      properties:
        version: { type: string }
        apiVersion: { type: string }
        features:
          type: object
          properties:
            pagination: { type: boolean }
            sorting: { type: boolean }
            bulkOperations: { type: boolean }
            idempotencyKeys: { type: boolean }
            etags: { type: boolean }
            webhooks: { type: boolean }
            serviceAccounts: { type: boolean }
            apiScopes: { type: boolean }

    # ==================== Phase 8 Webhook Schemas ====================

    WebhookCreateRequest:
      type: object
      required: [name, url, events]
      properties:
        name: { type: string }
        description: { type: string }
        url: { type: string, format: uri }
        events:
          type: array
          items: { type: string, enum: [asset.created, asset.updated, asset.deleted, risk.assessed, control.verified, incident.created] }
        isActive: { type: boolean, default: true }
        maxRetries: { type: integer, minimum: 0, maximum: 10, default: 3 }
        timeoutMs: { type: integer, minimum: 1000, default: 10000 }

    WebhookUpdateRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        url: { type: string, format: uri }
        events:
          type: array
          items: { type: string }
        isActive: { type: boolean }
        maxRetries: { type: integer }
        timeoutMs: { type: integer }

    WebhookResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        displayId: { type: string }
        name: { type: string }
        description: { type: string }
        url: { type: string }
        events:
          type: array
          items: { type: string }
        isActive: { type: boolean }
        isArchived: { type: boolean }
        lastDeliveryStatus: { type: string, nullable: true }
        lastDeliveredAt: { type: string, format: date-time, nullable: true }
        failureCount: { type: integer }
        maxRetries: { type: integer }
        timeoutMs: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    WebhookListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/WebhookResponse' }
        pagination:
          type: object
          properties:
            page: { type: integer }
            limit: { type: integer }
            total: { type: integer }
            totalPages: { type: integer }

    WebhookDeliveryResult:
      type: object
      properties:
        success: { type: boolean }
        statusCode: { type: integer, nullable: true }
        responseTimeMs: { type: integer }
        error: { type: string, nullable: true }
        signature: { type: string, description: HMAC-SHA256 signature }

    # ==================== Phase 8 Service Account Schemas ====================

    ServiceAccountCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        scopes:
          type: array
          items: { type: string, enum: [assets:read, assets:write, risks:read, risks:write, webhooks:read, webhooks:write, serviceaccounts:read, serviceaccounts:write, admin] }
        expiresAt: { type: string, format: date-time, nullable: true }

    ServiceAccountUpdateRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        scopes:
          type: array
          items: { type: string }
        isActive: { type: boolean }

    ServiceAccountResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        displayId: { type: string }
        name: { type: string }
        description: { type: string }
        scopes:
          type: array
          items: { type: string }
        isActive: { type: boolean }
        isArchived: { type: boolean }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ServiceAccountTokenResponse:
      type: object
      properties:
        token: { type: string, description: New service account token - store securely }
        id: { type: string, format: uuid }
        name: { type: string }
        expiresAt: { type: string, format: date-time, nullable: true }

    ServiceAccountListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ServiceAccountResponse' }
        pagination:
          type: object
          properties:
            page: { type: integer }
            limit: { type: integer }
            total: { type: integer }
            totalPages: { type: integer }

    # ==================== Phase 8 Bulk Operation Schemas ====================

    BulkAssetRequest:
      type: object
      required: [operations]
      properties:
        operations:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [action, data]
            properties:
              action: { type: string, enum: [create, update, delete] }
              id: { type: string, format: uuid, description: Required for update/delete }
              data:
                type: object
                description: Asset data for create/update operations

    BulkOperationResponse:
      type: object
      properties:
        succeeded:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              status: { type: integer }
        failed:
          type: array
          items:
            type: object
            properties:
              id: { type: string, nullable: true }
              error: { type: string }
              status: { type: integer }
        total: { type: integer }
        succeededCount: { type: integer }
        failedCount: { type: integer }

    # ==================== Phase 8 Version Schemas ====================

    VersionHistoryResponse:
      type: object
      properties:
        versions:
          type: array
          items:
            type: object
            properties:
              version: { type: integer }
              etag: { type: string }
              updatedAt: { type: string, format: date-time }

    # ==================== Phase 8 Error Response Schemas ====================

    ApiErrorResponse:
      type: object
      properties:
        error: { type: string }
        message: { type: string }
        currentVersion: { type: integer, nullable: true }
        currentEtag: { type: string, nullable: true }
