  # ==================== ISMS operations (phase6Router alias mount) ====================
  /isms-operations/{resource}:
    get:
      summary: List ISMS operations records for a resource key
      description: >
        Generic resource list backed by PHASE6_MODEL_MAP. The resource key must
        be a Phase6Resource enum value; unknown keys return 404. Permission is
        resolved via the RESOURCE_PERMISSION_ALIAS table in
        backend/src/routes/phase6.routes.ts (e.g. suppliers → suppliers.read,
        bias/bcps → bcm.read, auditPlans → audits.read).
      tags: [ISMS Operations]
      security: [{ bearerAuth: [] }]
      x-permission: resource-mapped read permission (see Phase6Resource enum and RESOURCE_PERMISSION_ALIAS)
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Phase6Resource'
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: search, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: ownerId, in: query, required: false, schema: { type: string } }
        - { name: dueBefore, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: overdue, in: query, required: false, schema: { type: boolean } }
      responses:
        '200':
          description: Paginated resource records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Phase6ListResponse'
        '404': { description: Unknown resource key }
    post:
      summary: Create an ISMS operations record for a resource key
      tags: [ISMS Operations]
      security: [{ bearerAuth: [] }]
      x-permission: resource-mapped write permission (see Phase6Resource enum and RESOURCE_PERMISSION_ALIAS)
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Phase6Resource'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '201':
          description: Created resource record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Phase6Record'
        '404': { description: Unknown resource key }

  /isms-operations/{resource}/{id}:
    get:
      summary: Read one ISMS operations record
      tags: [ISMS Operations]
      security: [{ bearerAuth: [] }]
      x-permission: resource-mapped read permission (see Phase6Resource enum and RESOURCE_PERMISSION_ALIAS)
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Phase6Resource'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Resource record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Phase6Record'
        '404': { description: Record or resource key not found }
    patch:
      summary: Update one ISMS operations record
      tags: [ISMS Operations]
      security: [{ bearerAuth: [] }]
      x-permission: resource-mapped write permission (see Phase6Resource enum and RESOURCE_PERMISSION_ALIAS)
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Phase6Resource'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Updated resource record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Phase6Record'
    delete:
      summary: Delete one ISMS operations record
      description: Soft-delete/remove the record according to PHASE6_MODEL_MAP. The router returns the removal result as a JSON body.
      tags: [ISMS Operations]
      security: [{ bearerAuth: [] }]
      x-permission: resource-mapped write permission (see Phase6Resource enum and RESOURCE_PERMISSION_ALIAS)
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Phase6Resource'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Removed resource record result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Phase6Record'

  /isms-operations/{resource}/export:
    get:
      summary: Export resource records as JSON or CSV in a persisted ExportJob
      tags: [Compliance]
      security: [{ bearerAuth: [] }]
      x-permission: resource-mapped read permission (see Phase6Resource enum)
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Phase6Resource'
        - { name: format, in: query, required: false, schema: { type: string, enum: [json, csv], default: json } }
      responses:
        '200':
          description: Persisted ExportJob
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJobResponse'
        '400': { description: Only JSON and CSV exports are supported }

  # ==================== Components ====================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiScopesHeader:
      type: apiKey
      in: header
      name: X-API-Scopes
      description: >
        Comma-separated declared scopes for service-account operations. The
        apiScopes middleware compares the declared scopes against the required
        scope and rejects mismatches; operations that declare `x-scopes` use
        this header contract. Never put secrets in this header.

  parameters:
    PageQuery:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
      description: Page number for sub-resource listings (server-side default 1)
    LimitQuery:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: Page size for sub-resource listings (server-side default 20)
    SortByQuery:
      name: sortBy
      in: query
      required: false
      schema: { type: string, maxLength: 100 }
      description: Optional sort column
    SortOrderQuery:
      name: sortOrder
      in: query
      required: false
      schema: { type: string, enum: [asc, desc], default: asc }
      description: Sort direction for sub-resource listings

  headers:
    XTotalCount:
      description: Total number of records matching the query across all pages
        (independent of the current page size). Primary list routes and sub-resource
        routes emit this additively next to the `{ data, pagination }` body envelope
        (Phase 1.1, decision D1 — no `meta` field, envelope unchanged).
      schema: { type: integer }

  schemas:
    RestoreEntityResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string }

    Nis2CrosswalkCompletenessReport:
      type: object
      required: [articleCount, controlCount, mappedControlCount, isComplete, articles, missingControls, unknownControls, unmappedArticles, unmappedControls]
      properties:
        articleCount: { type: integer }
        controlCount: { type: integer }
        mappedControlCount: { type: integer }
        isComplete: { type: boolean }
        articles:
          type: array
          items:
            type: object
            required: [articleId, article, controls, validControls, missingControls, unknownControls]
            properties:
              articleId: { type: string }
              article: { type: string }
              titleDe: { type: string }
              titleEn: { type: string }
              controls: { type: array, items: { type: string } }
              validControls: { type: array, items: { type: string } }
              missingControls: { type: array, items: { type: string } }
              unknownControls: { type: array, items: { type: string } }
        missingControls: { type: array, items: { type: string } }
        unknownControls: { type: array, items: { type: string } }
        unmappedArticles: { type: array, items: { type: string } }
