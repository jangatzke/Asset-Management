        assetSubtypeId: { type: string, format: uuid }
        technicalOperatorId:
          type: string
          format: uuid
          description: Technical operator User ID. FK-validated; inactive or unknown users are rejected (400/409).
        businessOwnerId:
          type: string
          format: uuid
          description: Business owner User ID. FK-validated; inactive or unknown users are rejected (400/409).
        informationSecurityResponsibleId:
          type: string
          format: uuid
          description: Information security responsible User ID. FK-validated; inactive or unknown users are rejected (400/409).
