openapi: 3.1.0
info:
  title: Asset Management System API (ISO 27001)
  version: 1.0.0
  description: RESTful API for IT Asset & ISMS Management with ISO 27001 compliance
  contact:
    name: API Support

servers:
  - url: http://localhost:3000/api/v1
    description: Development

paths:
  /phase6/resources:
    get:
      summary: List available Phase 6 resources
      tags: [Phase6]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Resource keys for generic Phase 6 API }

  /phase6/{resource}:
    get:
      summary: List Phase 6 records with filters
      tags: [Phase6]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: resource, in: path, required: true, schema: { type: string } }
        - { name: search, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: overdue, in: query, required: false, schema: { type: boolean } }
      responses:
        '200': { description: Paginated Phase 6 records }
    post:
      summary: Create Phase 6 record
      tags: [Phase6]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: resource, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '201': { description: Created record }

  /phase6/{resource}/{id}:
    get:
      summary: Get Phase 6 record
      tags: [Phase6]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: resource, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Phase 6 record }
    patch:
      summary: Update Phase 6 record
      tags: [Phase6]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: resource, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Updated record }

  /phase6/{resource}/export:
    get:
      summary: Export Phase 6 records as JSON or CSV
      tags: [Phase6]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: resource, in: path, required: true, schema: { type: string } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [json, csv] } }
      responses:
        '200': { description: Persisted ExportJob }

  /phase6/corrective-actions/from-source:
    post:
      summary: Create CAPA from Audit, Incident, Risk, Control or Supplier
      tags: [Phase6]
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Corrective action }

  /phase6/workflows/start:
    post:
      summary: Start a generic workflow instance
      tags: [Phase6]
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Workflow instance }

  /phase6/workflows/{id}/transition:
    post:
      summary: Transition a generic workflow instance
      tags: [Phase6]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Updated workflow instance }

  /phase6/reports/run:
    post:
      summary: Run and persist a Phase 6 report
      tags: [Phase6]
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: ReportRun }

  /frameworks:
    get:
      summary: List frameworks with recent versions
      tags: [Phase4]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Framework list }

  /frameworks/import:
    post:
      summary: Import framework version, requirements and license notices
      tags: [Phase4]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FrameworkImport' }
      responses:
        '201': { description: Imported immutable framework version }

  /frameworks/versions/compare:
    post:
      summary: Compare two framework versions
      tags: [Phase4]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromVersionId, toVersionId]
              properties:
                fromVersionId: { type: string, format: uuid }
                toVersionId: { type: string, format: uuid }
      responses:
        '200': { description: Added, removed, changed and unchanged requirements }

  /controls/implementations:
    post:
      summary: Create scoped control implementation fulfilling multiple requirements
      tags: [Phase4]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ControlImplementationInput' }
      responses:
        '201': { description: Control implementation with findings and actions }

  /controls/soa:
    get:
      summary: List Statement of Applicability versions with SoAItems
      tags: [Phase4]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: SoA list }
    post:
      summary: Create Statement of Applicability from individual SoAItems
      tags: [Phase4]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SoAInput' }
      responses:
        '201': { description: Draft SoA }

  /controls/soa/{id}/submit:
    post:
      summary: Submit SoA for formal approval
      tags: [Phase4]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: SoA under review }

  /controls/soa/{id}/approve:
    post:
      summary: Approve or reject SoA; approved versions become immutable
      tags: [Phase4]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                decision: { type: string, enum: [approved, rejected], default: approved }
                comment: { type: string }
      responses:
        '200': { description: Approval decision recorded }

  /evidence:
    get:
      summary: List evidence metadata and relations
      tags: [Phase4]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Evidence list }
    post:
      summary: Create secure evidence metadata with SHA-256 hash and retention
      tags: [Phase4]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvidenceInput' }
      responses:
        '201': { description: Evidence metadata }

  /evidence/audit-package:
    post:
      summary: Export evidence audit package manifest
      tags: [Phase4]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Audit package manifest }

  /evidence/{id}:
    delete:
      summary: Archive evidence unless delete-protected or retained
      tags: [Phase4]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Evidence archived }
        '409': { description: Evidence protected from deletion }

  /documents:
    post:
      summary: Create controlled policy document with draft version
      tags: [Phase4]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyDocumentInput' }
      responses:
        '201': { description: Controlled document }

  /documents/{id}/transition:
    post:
      summary: Transition document workflow draft-review-approved-published-withdrawn
      tags: [Phase4]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Workflow transition recorded }

  /documents/{id}/acknowledge:
    post:
      summary: Acknowledge approved or published document
      tags: [Phase4]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201': { description: Acknowledgement recorded }

  /documents/reviews/escalate-overdue:
    post:
      summary: Escalate overdue document reviews
      tags: [Phase4]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Escalation result }

  # ==================== Health ====================
  /health:
    get:
      summary: Health check
      tags: [System]
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  timestamp: { type: string, format: date-time }

  # ==================== Authentication ====================
  /auth/has-admin:
    get:
      summary: Check if admin user exists
      tags: [Authentication]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  hasAdmin: { type: boolean }

  /auth/create-first-admin:
    post:
      summary: Create first admin user (one-time setup)
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /auth/register:
    post:
      summary: Register new user
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: Email already registered

  /auth/login:
    post:
      summary: Login with email/password
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials

  /auth/me:
    get:
      summary: Get current user profile
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /auth/me/preferences:
    patch:
      summary: Update user preferences (language, darkMode)
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                language: { type: string, example: de }
                darkMode: { type: boolean }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /auth/refresh:
    post:
      summary: Refresh JWT token
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }

  # ==================== OIDC ====================
  /auth/oidc/authorize:
    get:
      summary: Get OIDC authorization URL (with PKCE)
      tags: [OIDC]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorizeUrl: { type: string }
                  state: { type: string }
                  codeChallenge: { type: string }

  /auth/oidc/callback:
    post:
      summary: OIDC callback handler
      tags: [OIDC]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, state]
              properties:
                code: { type: string }
                state: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /auth/oidc/config:
    get:
      summary: Get OIDC configuration (safe, no secrets)
      tags: [OIDC]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcConfigResponse'

  # ==================== Admin - Users ====================
  /admin/users:
    get:
      summary: List all users
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
    post:
      summary: Create user (admin only)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /admin/users/{id}:
    get:
      summary: Get user by ID
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
    put:
      summary: Update user
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
    delete:
      summary: Delete user (soft delete / archive)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /admin/users/{id}/roles:
    put:
      summary: Assign roles to user
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roles:
                  type: array
                  items: { type: string }

  /admin/users/{id}/change-password:
    post:
      summary: Force password change for user
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                newPassword: { type: string, minLength: 12 }

  # ==================== Admin - Roles ====================
  /admin/roles:
    get:
      summary: List all roles
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleResponse'
    post:
      summary: Create role
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleInput'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'

  /admin/roles/{id}:
    put:
      summary: Update role
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
    delete:
      summary: Delete role
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  # ==================== Admin - Groups ====================
  /admin/groups:
    get:
      summary: List all groups
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupResponse'
    post:
      summary: Create group
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }

  /admin/groups/{id}/users:
    put:
      summary: Assign users to group
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }

  /admin/groups/{id}/roles:
    put:
      summary: Assign roles to group
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }

  # ==================== Admin - OIDC Config ====================
  /admin/oidc/config:
    get:
      summary: Get OIDC configuration (full)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcConfigResponse'
    put:
      summary: Update OIDC configuration
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OidcConfigInput'

  # ==================== Admin - Asset Types ====================
  /admin/asset-types:
    get:
      summary: List asset types
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssetTypeResponse'

  # ==================== Assets ====================
  /assets:
    get:
      summary: List assets (paginated, filterable)
      tags: [Assets]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
        - name: assetTypeId
          in: query
          schema: { type: string }
        - name: criticality
          in: query
          schema: { type: string, enum: [low, medium, high, critical] }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
    post:
      summary: Create asset
      tags: [Assets]
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetResponse'

  /assets/{id}:
    get:
      summary: Get asset by ID
      tags: [Assets]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetResponse'

  /assets/{id}/graph:
    get:
      summary: Get asset dependency graph (centered on this asset)
      tags: [Assets]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: depth
          in: query
          schema: { type: integer, default: 3 }

  /assets/graph:
    get:
      summary: Get full asset dependency graph
      tags: [Assets]
      security: [{ bearerAuth: [] }]

  /assets/{id}/impact-analysis:
    get:
      summary: Impact analysis for asset failure scenario
      tags: [Assets]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }

  # ==================== Risks ====================
  /risks:
    get:
      summary: List risks (paginated, filterable)
      tags: [Risks]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'

  # ==================== Controls ====================
  /controls:
    get:
      summary: List controls
      tags: [Controls]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'

  # ==================== Incidents ====================
  /incidents:
    get:
      summary: List incidents
      tags: [Incidents]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
    post:
      summary: Create incident with NIS-2 significance evaluation and automatic deadlines
      tags: [Incidents]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncidentInput' }
      responses:
        '201': { description: Created }
  /incidents/{id}/knowledge-time:
    post:
      summary: Change protected incident knowledge time with mandatory reason and audit log
      tags: [Incidents]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeTimeChangeInput' }
      responses:
        '200': { description: Updated }
  /incidents/{id}/reports:
    post:
      summary: Persist NIS-2 incident report package (24h, 72h, interim, monthly final)
      tags: [Incidents]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncidentReportInput' }
      responses:
        '201': { description: Created }
  /incidents/reports/{reportId}/export:
    get:
      summary: Export persisted incident report package
      tags: [Incidents]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: reportId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Export package }
  /incidents/{id}/close:
    post:
      summary: Close incident after root cause and measures evaluation
      tags: [Incidents]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncidentClosureInput' }
      responses:
        '200': { description: Closed }

  # ==================== NIS-2 ====================
  /nis2/assessments:
    post:
      summary: Create versioned NIS-2 applicability assessment with preliminary evaluation
      tags: [NIS2]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Nis2AssessmentInput' }
      responses:
        '201': { description: Created }
  /nis2/assessments/{id}/approve:
    post:
      summary: Professionally approve NIS-2 applicability assessment
      tags: [NIS2]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Approved }
  /nis2/registrations:
    post:
      summary: Create NIS-2 registration with deadline and submission proof
      tags: [NIS2]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Nis2RegistrationInput' }
      responses:
        '201': { description: Created }
  /nis2/registrations/{id}/changes:
    post:
      summary: Record NIS-2 registration change notification
      tags: [NIS2]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '201': { description: Created }
  /nis2/measures-catalogue/ensure:
    post:
      summary: Ensure ten NIS-2 topic areas as requirements and controls
      tags: [NIS2]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Ensured }

