        name: { type: string }
        description: { type: string, nullable: true }
        assetTypeId: { type: string }
        assetSubtypeId: { type: string, nullable: true }
        inventoryNumber: { type: string, nullable: true }
        criticality: { type: string }
        lifecycleStatus: { type: string }
        confidentialityNeed: { type: string }
        integrityNeed: { type: string }
        availabilityNeed: { type: string }
  
    PaginatedResponse:
      type: object
      properties:
        data: { type: array, items: {} }
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
        totalPages: { type: integer }

    SubResourceListResponse:
      type: object
      description: Paginated sub-resource listing; `data` carries the rows and
        `pagination` the server-side totals. Additional keys (e.g. sourceRelations,
        upstream) may be present depending on the endpoint.
      properties:
        data: { type: array, items: {} }
        pagination:
          type: object
          properties:
            page: { type: integer }
            limit: { type: integer }
            total: { type: integer }
            totalPages: { type: integer }

    KnowledgeArticleListResponse:
      type: object
      description: Locked pagination envelope for GET /knowledge (decision D1).
        The matching X-Total-Count header carries pagination.total.
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              displayId: { type: string }
              title: { type: string }
              summary: { type: string, nullable: true }
              category: { type: string }
              tags: { type: array, items: { type: string } }
              status: { type: string }
              authorId: { type: string, nullable: true }
              relatedEntityType: { type: string, nullable: true }
              relatedEntityId: { type: string, nullable: true }
              viewCount: { type: integer }
              updatedAt: { type: string, format: date-time }
              createdAt: { type: string, format: date-time }
        pagination:
          type: object
          required: [page, limit, total, totalPages]
          properties:
            page: { type: integer }
            limit: { type: integer }
            total: { type: integer }
            totalPages: { type: integer }

# ==================== Phase 8: API, Betrieb und Nachweise ====================

  # NOTE (Stand 2026-10-30): the duplicated Phase 8 path definitions that previously
  # followed here (/health/live, /health/ready, /metrics, /webhooks*, /service-accounts*,
  # /api-info) were indented inside `components:` instead of `paths:` and therefore did
  # not parse as API paths at all. They were removed; every one of these endpoints is
  # already defined exactly once in the paths section above (and /api-info does not
  # exist in the backend, so it was removed entirely).

    WebhookInput:
      type: object
      required: [name, url]
      properties:
        name: { type: string }
        description: { type: string }
        url: { type: string, format: uri }
        events:
          type: array
          items:
            type: string
            enum:
              - asset.created
              - asset.updated
              - asset.deleted
              - risk.created
              - risk.updated
              - risk.assessed
              - control.created
              - control.updated
              - control.verified
              - incident.created
              - incident.updated
              - incident.closed
              - user.created
              - user.updated
              - user.deleted
              - system.health.check
        maxRetries: { type: integer, default: 3 }
        timeoutMs: { type: integer, default: 10000 }

    WebhookResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        displayId: { type: string }
        name: { type: string }
        description: { type: string }
        url: { type: string, format: uri }
        events:
          type: array
          items: { type: string }
        isActive: { type: boolean }
        isArchived: { type: boolean }
        lastDeliveryStatus: { type: string, enum: [success, failed, pending] }
        lastDeliveredAt: { type: string, format: date-time }
        failureCount: { type: integer }
        maxRetries: { type: integer }
        timeoutMs: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ServiceAccountInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        userId: { type: string, format: uuid }
        scopes:
          type: array
          items: { type: string }
        expiresAt: { type: string, format: date-time }

    ServiceAccountResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        displayId: { type: string }
        name: { type: string }
        description: { type: string }
        userId: { type: string, format: uuid }
        scopes:
          type: array
          items: { type: string }
        isActive: { type: boolean }
        isArchived: { type: boolean }
        lastUsedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    IdempotencyErrorResponse:
      type: object
      properties:
        error: { type: string }
        message: { type: string }

    OptimisticLockError:
      type: object
      properties:
        error: { type: string, example: Precondition Failed }
        message: { type: string }
        currentVersion: { type: integer }
        currentEtag: { type: string }

    ApiScopesErrorResponse:
      type: object
      properties:
        error: { type: string }
        message: { type: string }
        missingScopes:
          type: array
          items: { type: string }
        grantedScopes:
          type: array
          items: { type: string }

    WebhookDeliveryResult:
      type: object
      properties:
        success: { type: boolean }
        statusCode: { type: integer }
        errorMessage: { type: string }
        durationMs: { type: integer }
        attemptNumber: { type: integer }

    HealthStatus:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
        timestamp: { type: string, format: date-time }
        uptime: { type: integer }

    ReadinessStatus:
      type: object
      properties:
        status: { type: string, enum: [ready, not_ready] }
        ready: { type: boolean }
        uptime: { type: integer }
        timestamp: { type: string, format: date-time }
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              status: { type: string, enum: [healthy, unhealthy] }
              duration: { type: integer }

    LivenessStatus:
      type: object
      properties:
        status: { type: string, example: ok }
        uptime: { type: integer }
        timestamp: { type: string, format: date-time }

    ApiInfoResponse:
      type: object
      properties:
        version: { type: string }
        features:
          type: object
          properties:
            correlationId: { type: boolean }
            etag: { type: boolean }
            idempotencyKeys: { type: boolean }
            webhooks: { type: boolean }
            serviceAccounts: { type: boolean }
            structuredLogging: { type: boolean }
            metrics: { type: boolean }

    # ==================== Phase 8 Headers ====================
    responseHeaders:
      X-Correlation-Id:
        schema: { type: string, format: uuid }
        description: Correlation ID for request tracing
      ETag:
        schema: { type: string }
        description: Entity tag for conditional requests
      X-Resource-Version:
        schema: { type: integer }
        description: Resource version for optimistic locking
      X-Total-Count:
        schema: { type: integer }
        description: Total number of items (pagination)
      X-Page:
        schema: { type: integer }
        description: Current page number
      X-Limit:
        schema: { type: integer }
        description: Items per page
      X-Total-Pages:
        schema: { type: integer }
        description: Total number of pages
      Link:
        schema: { type: string }
        description: Pagination links (rel="prev", rel="next")
      X-Idempotency-Cache:
        schema: { type: string, enum: [hit] }
        description: Present when idempotency key was cached
      X-RateLimit-Limit:
        schema: { type: integer }
        description: Rate limit bucket size
      X-RateLimit-Remaining:
        schema: { type: integer }
        description: Remaining requests in current window
      X-RateLimit-Reset:
        schema: { type: integer }
        description: Seconds until rate limit resets

    # NOTE (Stand 2026-10-30): the schemas below were previously mis-indented inside the
    # responseHeaders schema and therefore not resolvable via #/components/schemas/...;
    # their key lines are now proper components.schemas entries. Duplicate definitions of
    # ApiInfoResponse, WebhookResponse, WebhookDeliveryResult and ServiceAccountResponse
    # (already defined above) were removed.
    # ==================== Phase 8 Health/Metrics Schemas ====================
    LiveHealthResponse:
        type: object
        properties:
          status: { type: string, example: ok }
          uptime: { type: integer, description: Server uptime in seconds }
          timestamp: { type: string, format: date-time }

    ReadyHealthCheck:
        type: object
        properties:
          status: { type: string, enum: [healthy, unhealthy] }
          duration: { type: integer, description: Check duration in ms }

    ReadyHealthResponse:
        type: object
        properties:
          status: { type: string, example: ready }
          ready: { type: boolean }
          uptime: { type: integer }
          timestamp: { type: string, format: date-time }
          checks:
            type: object
            properties:
              database:
                $ref: '#/components/schemas/ReadyHealthCheck'
              webhookQueue:
                $ref: '#/components/schemas/ReadyHealthCheck'

      # (duplicate ApiInfoResponse definition removed — the one above is used)

      # ==================== Phase 8 Webhook Schemas ====================

    WebhookCreateRequest:
        type: object
        required: [name, url, events]
        properties:
          name: { type: string }
          description: { type: string }
          url: { type: string, format: uri }
          events:
            type: array
            # Event set per backend/src/services/webhook.service.ts (WebhookEvent union)
            items: { type: string, enum: [asset.created, asset.updated, asset.deleted, risk.created, risk.updated, risk.assessed, control.created, control.updated, control.verified, incident.created, incident.updated, incident.closed, user.created, user.updated, user.deleted, system.health.check, webhook.delivery.failed, webhook.delivery.success] }
          isActive: { type: boolean, default: true }
          maxRetries: { type: integer, minimum: 0, maximum: 10, default: 3 }
          timeoutMs: { type: integer, minimum: 1000, default: 10000 }

    WebhookUpdateRequest:
        type: object
        properties:
          name: { type: string }
          description: { type: string }
          url: { type: string, format: uri }
          events:
            type: array
            items: { type: string }
          isActive: { type: boolean }
          maxRetries: { type: integer }
          timeoutMs: { type: integer }

      # (duplicate WebhookResponse definition removed — the one above is used)

    WebhookListResponse:
        type: object
        properties:
          data:
            type: array
            items: { $ref: '#/components/schemas/WebhookResponse' }
          pagination:
            type: object
            properties:
              page: { type: integer }
              limit: { type: integer }
              total: { type: integer }
              totalPages: { type: integer }

      # (duplicate WebhookDeliveryResult definition removed — the one above matches the
      # handler fields durationMs/attemptNumber from webhook.service.ts and is used)

      # ==================== Phase 8 Service Account Schemas ====================

    ServiceAccountCreateRequest:
        type: object
        required: [name]
        properties:
          name: { type: string }
          description: { type: string }
          scopes:
            type: array
            # Scopes are validated by regex in serviceAccount.routes.ts (scopeSchema), not a closed enum
            items: { type: string, pattern: '^[a-z][a-z0-9-]*:(?:[a-z][a-z0-9-]*|\*)$' }
          userId: { type: string, format: uuid }
          expiresAt: { type: string, format: date-time, nullable: true }

    ServiceAccountUpdateRequest:
        type: object
        properties:
          name: { type: string }
          description: { type: string }
          scopes:
            type: array
            items: { type: string }
          isActive: { type: boolean }

      # (duplicate ServiceAccountResponse definition removed — the one above is used)

    ServiceAccountTokenResponse:
        type: object
        properties:
          token: { type: string, description: New service account token - store securely }
          id: { type: string, format: uuid }
          name: { type: string }
          expiresAt: { type: string, format: date-time, nullable: true }

    ServiceAccountListResponse:
        type: object
        properties:
          data:
            type: array
            items: { $ref: '#/components/schemas/ServiceAccountResponse' }
          pagination:
            type: object
            properties:
              page: { type: integer }
              limit: { type: integer }
              total: { type: integer }
              totalPages: { type: integer }

      # ==================== Phase 8 Bulk Operation Schemas ====================

    BulkAssetRequest:
        type: object
        required: [operations]
        properties:
          operations:
            type: array
            minItems: 1
            maxItems: 100
            items:
              type: object
              required: [action, data]
              properties:
                action: { type: string, enum: [create, update, delete] }
                id: { type: string, format: uuid, description: Required for update/delete }
                data:
                  type: object
                  description: Asset data for create/update operations

    BulkOperationResponse:
        type: object
        properties:
          succeeded:
            type: array
            items:
              type: object
              properties:
                id: { type: string }
                status: { type: integer }
          failed:
            type: array
            items:
              type: object
              properties:
                id: { type: string, nullable: true }
                error: { type: string }
                status: { type: integer }
          total: { type: integer }
          succeededCount: { type: integer }
          failedCount: { type: integer }

    BulkArchiveIdsRequest:
        type: object
        description: Ids of records to archive (soft-delete) in the bulk archive routes.
        required: [ids]
        properties:
          ids:
            type: array
            minItems: 1
            maxItems: 100
            items: { type: string }

    RestoreEntityRequest:
        type: object
        description: >
          Optional restore metadata shared by the Tickets, Risks, Controls and
          Incidents restore endpoints. Mirrors the ArchiveAssetRequest shape.
        properties:
          reason:
            type: string
            maxLength: 500
            description: Optional justification recorded in audit and history entries.

    BulkTransitionRequest:
        type: object
        description: >
          Bulk ticket status transition. The shared state machine validates every
          id before any write; when any id has no legal transition to toStatus the
          request is rejected with 400.
        required: [ids, toStatus]
        properties:
          ids:
            type: array
            minItems: 1
            maxItems: 100
            items: { type: string }
          toStatus: { type: string, description: TicketStatus enum value from shared }
          justification: { type: string }

      # ==================== Phase 8 Version Schemas ====================

    VersionHistoryResponse:
        type: object
        properties:
          versions:
            type: array
            items:
              type: object
              properties:
                version: { type: integer }
                etag: { type: string }
                updatedAt: { type: string, format: date-time }

      # ==================== Phase 8 Error Response Schemas ====================

    ApiErrorResponse:
        type: object
        properties:
          error: { type: string }
          message: { type: string }
          currentVersion: { type: integer, nullable: true }
          currentEtag: { type: string, nullable: true }

