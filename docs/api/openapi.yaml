    get:
      summary: Get service account details
      tags: [Service Accounts]
      security: [{ bearerAuth: [] }]
      x-permission: administration.access
      x-scopes: [serviceaccounts:read]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-API-Scopes
          in: header
          required: false
          description: Comma-separated declared scopes (must include serviceaccounts:read).
          schema: { type: string }
      responses:
        '200':
          description: Service account details (token excluded)

    patch:
      summary: Update service account
      tags: [Service Accounts]
      security: [{ bearerAuth: [] }]
      x-permission: administration.access
      x-scopes: [serviceaccounts:write]
      parameters:
        - name: id
