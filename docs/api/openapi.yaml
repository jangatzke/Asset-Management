  # ==================== Admin - Users ====================
  /users/owners:
    get:
      summary: Search active users for owner/responsible person selection
      description: >-
        Lightweight lookup endpoint for assigning owners, technical operators and
        information-security-responsible persons (Assets) as well as risk owner and
        assessor (Risks). Returns active users only and never exposes role
        administration data. Backed by real User relations (FK + ON DELETE SET NULL
        on assets, ON DELETE RESTRICT on risks); IDs supplied by clients are
        validated server-side (400 for unknown users, 409 for inactive users).
      tags: [Users]
      security: [{ bearerAuth: [] }]
      x-permission: administration.access
      parameters:
        - name: q
          in: query
          description: Optional search term applied to email/name.
          schema: { type: string }
        - name: limit
          in: query
          description: Maximum number of results (server-capped at 500).
