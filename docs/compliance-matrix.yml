- id: RSK-003
  title: Risiko-Behandlung und Risiko-Akzeptanz
  priority: P1
  status: compliant
  implementation:
    - backend/prisma/schema.prisma
    - backend/prisma/migrations/20260718160000_risk_treatment_acceptance_workflow/migration.sql
    - backend/src/routes/risktreatment.routes.ts
    - backend/src/services/risktreatment.service.ts
    - backend/src/routes/risk.routes.ts
    - backend/src/services/risk.service.ts
    - shared/src/types/risk.ts
    - shared/src/dtos/index.ts
  tests:
    - backend/src/__tests__/risktreatment.service.test.ts
  gaps: []
  evidence:
    - Direkter /risks/:id/accept-Bypass entfernt; keine acceptRisk-Servicefunktion mehr
    - Acceptance läuft über RiskTreatment/RiskAcceptance mit konkreter RiskAssessment-Version
    - Begründung, Ablaufdatum und Genehmiger sind verpflichtend
    - Low/medium Acceptance erfordert Risk-Owner-Freigabe
    - High/critical Acceptance erfordert unabhängige Management/Admin-Freigabe
    - Vier-Augen-Prinzip verhindert, dass Assessor eigene Hochrisikoakzeptanz genehmigt
    - Mitigation-Abschluss ohne Effectiveness Review wird blockiert
    - Abschluss erzeugt oder bestätigt Ziel-/Restrisiko-Assessment ohne historische Assessments zu überschreiben
    - Auditlog-Aktionen für Treatment, Acceptance, Approval, Effectiveness Review und Completion ergänzt

