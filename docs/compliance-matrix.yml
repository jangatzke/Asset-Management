- id: RSK-004
  title: Versionierte Risikomethoden und Assessment-Historisierung
  priority: P1
  status: compliant
  implementation:
    - backend/prisma/schema.prisma
    - backend/prisma/migrations/20260718130000_risk_method_versioning/migration.sql
    - backend/src/services/riskmethod.service.ts
    - backend/src/routes/riskmethod.routes.ts
    - shared/src/types/risk.ts
    - shared/src/dtos/index.ts
  tests:
    - backend/src/__tests__/riskmethod.service.test.ts
  gaps: []
  evidence:
    - RiskMethodVersion-Modell speichert unveraenderliche Snapshots der Methodendefinition (Paket 3.1)
    - RiskAssessment-Modell bindet jede Bewertung an eine konkrete Methodenversion (Paket 3.1)
    - Berechnungstypen explizit definiert: product, sum, max, matrix — kein eval/Function (Paket 3.1)
    - Eingaben werden gegen Skalenbereiche validiert (SafeCalculationEngine.validateInputs) (Paket 3.1)
    - RecalculatePreview ist rein lesend und persistiert keine Daten (Paket 3.1)
    - ConfirmedRecalculation erzeugt neue RiskAssessment-Version ohne historische Daten zu beschreiben (Paket 3.1)
    - Methodenversion wird automatisch als immutable markiert, sobald erste Assessment referenziert (Paket 3.1)
    - Loeschen von RiskMethod mit referenzierten Versionen wird blockiert (409 Conflict) (Paket 3.1)
    - Audit-Log-Eintraege bei Methodenerstellung, -aenderung und Neuberechnung (Paket 3.1)
    - DTO-Schemata mit Zod fuer CreateRiskMethod, ConfirmRecalculation, BulkConfirmRecalculation, CalculateRiskScore (Paket 3.1)

