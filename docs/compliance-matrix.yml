- id: IAM-001
  title: Administrationsschutz
  priority: P0
  status: compliant
  implementation:
    - backend/src/routes/admin.routes.ts
    - backend/src/middleware/auth.ts
    - backend/src/middleware/entityAuth.ts
    - backend/src/services/authorization.service.ts
    - backend/src/routes/intune.routes.ts
    - backend/src/routes/vmware.routes.ts
    - backend/src/routes/proxmox.routes.ts
  tests:
    - backend/src/__tests__/authorization.integration.test.ts
    - backend/src/__tests__/admin.service.test.ts
  gaps: []
  evidence:
    - requireAdminAccess middleware prüft role.canAccessAdmin aus Datenbank (nicht Legacy-String)
    - Abgelaufene Rollen (validUntil < now) werden als unwirksam behandelt
    - Alle Admin-, Intune-, VMware- und Proxmox-Routen geschützt
    - Group-basierte Rollen-Zuweisungen unterstützt

- id: IAM-002
  title: Entity-Level Authorization
  priority: P0
  status: compliant
  implementation:
    - backend/src/services/authorization.service.ts
    - backend/src/middleware/entityAuth.ts
    - backend/src/routes/asset.routes.ts
    - backend/src/routes/risk.routes.ts
    - backend/src/routes/control.routes.ts
    - backend/src/routes/incident.routes.ts
  tests:
    - backend/src/__tests__/authorization.integration.test.ts
  gaps: []
  evidence:
    - authorizationService.checkEntityPermission() prüft entityPermissions pro Rolle
    - authorizeEntityWrite/authorizeEntityDelete Middleware schützt POST/PUT/PATCH/DELETE
    - Permission-Aggregation über multiple Rollen (max wins)
    - Scope- und Organisationseinschränkungen vorbereitet

- id: IAM-003
  title: Routenreihenfolge und Konfliktfreiheit
  priority: P0
  status: compliant
  implementation:
    - backend/src/index.ts
    - backend/src/routes/asset.routes.ts
    - backend/src/routes/risk.routes.ts
    - backend/src/routes/control.routes.ts
  tests:
    - backend/src/__tests__/auth.routes.test.ts
    - backend/src/__tests__/route.order.test.ts
  gaps: []
  evidence:
    - Statische Routen (/types, /graph, /incomplete, /import) VOR parametrisierten Routes (/:id) in asset.routes.ts
    - Aggregierte Routes (/aggregated/*, /dashboard-summary, /check-unplanned-review) VOR /:id in risk.routes.ts
    - Statische Route /soa VOR /:id in control.routes.ts
    - Admin-Sub-Routern (/admin/vmware, /admin/proxmox) werden nach /admin gemountet - Reihenfolge korrekt
    - Integrationstest für Route-Konflikte (route.order.test.ts)

- id: SEC-001
  title: JWT-Härtung
  priority: P0
  status: compliant
  implementation:
    - backend/src/middleware/auth.ts
    - backend/src/services/auth.service.ts
    - backend/src/services/oidc.service.ts
  tests:
    - backend/src/__tests__/auth.service.test.ts
    - backend/src/__tests__/oidc.security.test.ts
  gaps: []
  evidence:
    - JWT_SECRET ist zwingend erforderlich (kein Fallback)
    - App startet nicht ohne JWT_SECRET
    - Algorithmus HS256 explizit gesetzt
    - Refresh-Token-Rotation implementiert
    - Refresh-Tokens werden gehasht gespeichert
    - Logout widerruft alle Tokens der Session
    - Token-Logging entfernt

- id: SEC-002
  title: OIDC - State, Nonce und PKCE
  priority: P0
  status: compliant
  implementation:
    - backend/src/services/oidc.service.ts
    - backend/src/routes/auth.routes.ts
  tests:
    - backend/src/__tests__/oidc.security.test.ts
  gaps: []
  evidence:
    - State-Parameter wird bei Callback validiert
    - Nonce wird generiert und validiert
    - PKCE code_verifier wird validiert
    - Selbstregistrierung deaktiviert ohne Freigabe
    - First-Admin-Race durch Transaktion verhindert

- id: SEC-003
  title: CORS-Härtung
  priority: P0
  status: compliant
  implementation:
    - backend/src/index.ts
  tests:
    - backend/src/__tests__/cors.config.test.ts
  gaps: []
  evidence:
    - Kein Wildcard '*' als Default mehr (Paket 1.3)
    - Explizite Allowed Origins aus CORS_ORIGINS Umgebungsvariable
    - Fallback auf ['http://localhost:3000'] statt '*' wenn keine Origins konfiguriert
    - Ursprüngliches Problem: Wildcard-Fallback '*' wenn CORS_ORIGIN nicht gesetzt (index.ts:38)

