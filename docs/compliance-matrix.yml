# Compliance Matrix — Asset Management System
#
# This matrix distinguishes two dimensions:
#   Application Coverage: Can the application technically support this requirement?
#   Organization Compliance: Has the organization implemented the control and can provide evidence?
#
# Status terms (Application Coverage):
#   implemented     — Application code exists and passes tests.
#   tested          — Application feature has automated test coverage.
#   evidence-capable— Application can generate/export data supporting organizational evidence.
#   partial         — Application partially implements the requirement.
#   manual evidence required — Organization must collect evidence manually.
#   organizational control — Purely an organizational/process control, not an application feature.
#   not applicable to application — Requirement does not apply to the software product itself.
#
# Forbidden wording: "ISO 27001 compliant", "compliant with ISO 27001", "fully compliant",
# "meets ISO 27001 requirements" when claiming organizational compliance.

# Phase 11: Health Readiness & Metrics — Application Coverage
- id: OPS-1101
  title: Real readiness checks on /health/ready
  priority: P0
  dimension: application_coverage
  status: implemented
  implementation:
    - backend/src/middleware/health.ts
    - backend/src/routes/health.routes.ts
  tests:
    - backend/src/__tests__/phase8.health.test.ts
    - backend/src/__tests__/phase11.health-readiness.test.ts
  gaps: []
  evidence:
    - Database reachability check via $queryRaw SELECT 1
    - Schema/migration status checked via _prisma_migrations table (latest migration + pending count)
    - Required secrets (JWT_SECRET, DATABASE_URL) verified present
    - Optional integrations (Intune, SMTP, VMware, Proxmox) return degraded when configured but unhealthy
    - registerHealthCheck() and registerRuntimeHealthCheck() API for custom checks

